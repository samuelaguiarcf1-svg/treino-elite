<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V44 - Master Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; background-color: #fcfdfe; }
        .treino-concluido { border-left: 8px solid #2563eb; background-color: #ffffff; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; border-color: #2563eb; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .btn-step { @apply text-slate-500 hover:text-blue-400 transition-colors text-xs py-1; }
        .box-input::placeholder { color: #94a3b8; font-weight: 400; font-size: 0.65rem; }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <!-- HEADER STATUS -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div id="avatar-container" class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner">
                    <i id="avatar-icon" class="fas fa-user-ninja"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Performance Lab Ativo</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">VO2 Máx</span>
                    <span class="text-xl font-black text-emerald-400" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">IMC</span>
                    <span class="text-xl font-black text-blue-400" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-user-cog"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- DASHBOARD -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 text-center">
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <h3 class="text-slate-400 text-[10px] font-black uppercase">KM Total</h3>
                <p class="text-3xl font-black text-slate-800" id="km-semana">,0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-orange-500 md:col-span-3 text-left px-10">
                <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Tênis KM: <span id="tenis-nome-tag" class="text-orange-600 ml-2">--</span></h3>
                <div class="flex items-center gap-4 mt-1">
                    <p class="text-2xl font-black" id="km-tenis">,0 / 600</p>
                    <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden"><div id="barra-tenis" class="bg-orange-500 h-full transition-all duration-1000"></div></div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- AGENDA -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase tracking-tighter italic">Minha Agenda</h2>
                        <div class="flex gap-2">
                            <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-4 py-2.5 rounded-xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                                <i class="fab fa-strava text-lg"></i> SINCRONIZAR
                            </button>
                            <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-blue-700 transition shadow-lg uppercase">+ Planejar</button>
                        </div>
                    </div>
                    <div id="lista-treinos" class="space-y-6"></div>
                </div>
            </div>

            <!-- SIMULADOR PACE -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic">Simulador Pace</h2>
                    
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Distância (km)</label>
                            <div class="flex items-center justify-between px-2">
                                <button onclick="alterarDistancia(-0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-left"></i></button>
                                <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarPeloTempo();" class="bg-transparent text-4xl font-black text-white text-center w-24 outline-none font-mono">
                                <button onclick="alterarDistancia(0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-blue-400 block mb-2 tracking-widest">Pace Alvo (min : seg)</label>
                            <div class="flex items-center justify-center gap-4">
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('min', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-min" value="5" oninput="ajustarPeloPace()" class="box-input w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('min', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                                <span class="text-2xl font-black text-slate-700 mt-2">:</span>
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('seg', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-seg" value="0" oninput="ajustarPeloPace()" class="box-input w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('seg', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/10 text-center">
                            <label class="text-[9px] font-black uppercase text-emerald-400 block mb-2 tracking-widest">Tempo Final Alvo</label>
                            <div class="flex items-center justify-center gap-1">
                                <input type="number" id="sim-time-h" placeholder="h" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                                <span class="font-black text-slate-700">:</span>
                                <input type="number" id="sim-time-m" placeholder="min" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                                <span class="font-black text-slate-700">:</span>
                                <input type="number" id="sim-time-s" placeholder="seg" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                            </div>
                        </div>

                        <div class="bg-blue-600/10 p-5 rounded-3xl text-center border border-blue-500/20 shadow-inner">
                            <span class="text-[8px] font-black text-blue-400 block mb-1">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40 uppercase tracking-tighter">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL WIZARD -->
    <div id="modal-wizard" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 shadow-2xl overflow-y-auto max-h-[95vh]">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-8 uppercase italic">Setup de Ciclo de Performance</h3>
            <form onsubmit="event.preventDefault(); logicagerarPlanilhaElite();" class="space-y-6 text-center">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="date" id="wiz-data-inicio" class="p-4 bg-slate-50 rounded-2xl font-bold border text-center outline-none">
                    <input type="date" id="wiz-data-prova" class="p-4 bg-slate-50 rounded-2xl font-bold border text-center text-rose-500 outline-none">
                    <input type="text" id="wiz-dist" value="10" placeholder="KM" oninput="validarNumeros(this)" class="p-4 bg-slate-50 rounded-2xl font-black border text-center text-blue-600 outline-none">
                </div>
                <div class="bg-slate-50 p-6 rounded-3xl text-center">
                    <label class="text-[10px] font-black uppercase text-slate-500 block mb-2 tracking-widest font-bold">Tempo Alvo Final (HH:MM:SS)</label>
                    <input type="text" id="wiz-tempo" value="00:50:00" placeholder="00:50:00" class="w-full bg-transparent text-4xl font-black text-center outline-none border-b-2 border-slate-200">
                </div>
                <div class="flex flex-wrap gap-2 justify-center">
                    <input type="checkbox" id="w0" value="0" class="hidden checkbox-day"><label for="w0" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Dom</label>
                    <input type="checkbox" id="w1" value="1" class="hidden checkbox-day"><label for="w1" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Seg</label>
                    <input type="checkbox" id="w2" value="2" class="hidden checkbox-day" checked><label for="w2" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Ter</label>
                    <input type="checkbox" id="w3" value="3" class="hidden checkbox-day"><label for="w3" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Qua</label>
                    <input type="checkbox" id="w4" value="4" class="hidden checkbox-day" checked><label for="w4" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Qui</label>
                    <input type="checkbox" id="w5" value="5" class="hidden checkbox-day"><label for="w5" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Sex</label>
                    <input type="checkbox" id="w6" value="6" class="hidden checkbox-day" checked><label for="w6" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer transition uppercase">Sáb</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl">GERAR PLANILHA COM COACH</button>
            </form>
        </div>
    </div>

    <!-- MODAL PERFIL (CONFIGURAÇÃO STRAVA) -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center italic">Configurações Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200 space-y-2">
                    <label class="text-[9px] font-black uppercase text-orange-600 ml-1">Dados da sua API Strava</label>
                    <input type="text" id="strava-id" placeholder="Client ID (ex: 123456)" class="w-full p-3 bg-white rounded-xl border text-xs outline-none">
                    <input type="password" id="strava-secret" placeholder="Client Secret (Código secreto)" class="w-full p-3 bg-white rounded-xl border text-xs outline-none">
                </div>
                <input type="text" id="p-nome" placeholder="Nome" class="w-full border-2 p-4 rounded-2xl text-center font-bold outline-none">
                <div class="grid grid-cols-2 gap-2 text-center">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl font-bold">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl font-bold">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Salvar Configurações</button>
            </form>
        </div>
    </div>

    <!-- MODAL RELATÓRIO DO COACH -->
    <div id="modal-analise-coach" class="fixed inset-0 bg-slate-900/98 backdrop-blur-2xl hidden flex items-center justify-center p-4 z-[110]">
        <div class="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl border-t-8 border-blue-600">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-6 uppercase">Veredito do Coach Elite</h3>
            <div id="analise-texto" class="bg-slate-50 p-6 rounded-3xl text-sm leading-relaxed space-y-4"></div>
            <button onclick="toggleModal('modal-analise-coach')" class="w-full mt-8 bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Acessar Agenda</button>
        </div>
    </div>

    <script>
        // --- ESTADO INICIAL ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, stravaId: "", stravaSecret: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_Master');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('strava-id').value = appData.atleta.stravaId || "";
                document.getElementById('strava-secret').value = appData.atleta.stravaSecret || "";
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if(code) processarTrocaDeToken(code);

            document.getElementById('wiz-data-inicio').value = new Date().toISOString().split('T')[0];
            atualizarInterface();
            ajustarPeloPace();
        };

        // --- LÓGICA STRAVA ---
        function conectarStravaReal() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) return alert("Configure seu Strava Client ID no Perfil primeiro!");
            const redirectUri = window.location.href.split('?')[0]; 
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=activity:read_all`;
            window.location.href = authUrl;
        }

        async function processarTrocaDeToken(code) {
            toast("Trocando código por acesso...");
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId,
                        client_secret: appData.atleta.stravaSecret,
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                const data = await response.json();
                if(data.access_token) {
                    buscarTreinosReais(data.access_token);
                    window.history.pushState({}, document.title, window.location.pathname);
                }
            } catch (e) { alert("Comunicação com o Strava falhou."); }
        }

        async function buscarTreinosReais(token) {
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const atividades = await response.json();
                let novos = 0;
                atividades.forEach(ativ => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === ativ.id);
                    if(ativ.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+ativ.id,
                            stravaId: ativ.id,
                            data: ativ.start_date,
                            tipo: 'Strava Run',
                            distancia: (ativ.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(ativ.moving_time),
                            status: 'concluido',
                            bpm: Math.round(ativ.average_heartrate || 0)
                        });
                        novos++;
                    }
                });
                atualizarInterface();
                toast(`✅ ${novos} atividades sincronizadas!`);
            } catch (e) { alert("Erro ao ler atividades."); }
        }

        // --- LÓGICA SIMULADOR ---
        function stepPace(tipo, delta) {
            const el = document.getElementById(`sim-pace-${tipo}`);
            let val = (parseInt(el.value)||0) + delta;
            if(tipo==='seg') { if(val>59) val=0; if(val<0) val=59; }
            el.value = val; ajustarPeloPace();
        }

        function ajustarPeloPace() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) {
                const tot = p*d;
                document.getElementById('sim-time-h').value = Math.floor(tot/3600);
                document.getElementById('sim-time-m').value = Math.floor((tot%3600)/60);
                document.getElementById('sim-time-s').value = Math.round(tot%60);
                document.getElementById('sim-vel-res').innerText = (d/(tot/3600)).toFixed(1).replace('.',',');
            }
        }

        function ajustarPeloTempo() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const tot = (parseInt(document.getElementById('sim-time-h').value)||0)*3600 + (parseInt(document.getElementById('sim-time-m').value)||0)*60 + (parseInt(document.getElementById('sim-time-s').value)||0);
            if(d>0 && tot>0) {
                const p = tot/d;
                document.getElementById('sim-pace-min').value = Math.floor(p/60);
                document.getElementById('sim-pace-seg').value = Math.round(p%60);
                document.getElementById('sim-vel-res').innerText = (d/(tot/3600)).toFixed(1).replace('.',',');
            }
        }

        function alterarDistancia(delta) { 
            const el = document.getElementById('sim-dist'); 
            let v = parseFloat(el.value.replace(',','.'))||0; 
            el.value = fDist(Math.max(0.1, v+delta)); 
            ajustarPeloPace(); 
        }

        // --- GERADOR DE ELITE ---
        function logicagerarPlanilhaElite() {
            const dIn = new Date(document.getElementById('wiz-data-inicio').value);
            const dPr = new Date(document.getElementById('wiz-data-prova').value);
            const distObj = parseFloat(document.getElementById('wiz-dist').value.replace(',', '.')) || 10;
            const tempoObj = document.getElementById('wiz-tempo').value;
            const totalSegs = tempoParaSegundos(tempoObj);

            if(isNaN(dPr) ||
