<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite - Sincronização Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; }
        .treino-concluido { border-left: 8px solid #2563eb; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; border-color: #2563eb; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div id="avatar-container" class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500">
                    <i class="fas fa-bolt text-blue-400"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Strava Active Sync</p>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">IMC</span>
                    <span class="text-xl font-black text-blue-400" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-user-cog"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase">Minha Agenda</h2>
                    <div class="flex gap-2">
                        <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                            <i class="fab fa-strava text-lg"></i> SINCRONIZAR STRAVA
                        </button>
                        <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-blue-700 transition shadow-lg uppercase">+ Planejar</button>
                    </div>
                </div>
                <div id="lista-treinos" class="space-y-6 text-center"></div>
            </div>
        </div>
    </main>

    <!-- MODAL PERFIL (IMPORTANTE PARA COLOCAR O SECRET) -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center italic">Configurações Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200 space-y-2">
                    <label class="text-[9px] font-black uppercase text-orange-600 ml-1">Dados da sua API Strava</label>
                    <input type="text" id="strava-id" placeholder="Client ID (ex: 123456)" class="w-full p-3 bg-white rounded-xl border text-xs outline-none">
                    <input type="password" id="strava-secret" placeholder="Client Secret (Aquele código secreto)" class="w-full p-3 bg-white rounded-xl border text-xs outline-none">
                </div>
                <input type="text" id="p-nome" placeholder="Nome" class="w-full border-2 p-4 rounded-2xl text-center font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl text-center">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl text-center">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Salvar Configurações</button>
                <button type="button" onclick="toggleModal('modal-perfil')" class="w-full text-slate-400 font-bold text-xs mt-2 uppercase">Fechar</button>
            </form>
        </div>
    </div>

    <!-- MODAL RELATÓRIO -->
    <div id="modal-analise-coach" class="fixed inset-0 bg-slate-900/98 backdrop-blur-2xl hidden flex items-center justify-center p-4 z-[110]">
        <div class="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl border-t-8 border-blue-600">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-6">Status da Sincronização</h3>
            <div id="analise-texto" class="bg-slate-50 p-6 rounded-3xl text-sm leading-relaxed space-y-4"></div>
            <button onclick="toggleModal('modal-analise-coach')" class="w-full mt-8 bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs">Ver Agenda</button>
        </div>
    </div>

    <script>
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, stravaId: "", stravaSecret: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_Master');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('strava-id').value = appData.atleta.stravaId || "";
                document.getElementById('strava-secret').value = appData.atleta.stravaSecret || "";
            }
            
            // VERIFICA SE VOLTOU DO STRAVA COM O CÓDIGO
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if(code) processarTrocaDeToken(code);

            atualizarInterface();
        };

        // --- NOVA LÓGICA DE CONEXÃO STRAVA (SISTEMA SEGURO) ---
        function conectarStravaReal() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) return alert("Configure seu Client ID do Strava no Perfil (ícone de engrenagem)!");

            // Limpa a URL atual para gerar o link de retorno limpo
            const redirectUri = window.location.href.split('?')[0]; 
            
            // response_type agora é CODE (Obrigatório pelo Strava)
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=activity:read_all`;
            
            window.location.href = authUrl;
        }

        async function processarTrocaDeToken(code) {
            toast("Trocando código por acesso...");
            
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId,
                        client_secret: appData.atleta.stravaSecret,
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });

                const data = await response.json();
                if(data.access_token) {
                    buscarTreinosReais(data.access_token);
                    // Limpa a URL para não ficar com o código exposto
                    window.history.pushState({}, document.title, window.location.pathname);
                } else {
                    alert("Erro: Client Secret inválido ou expirado.");
                }
            } catch (e) {
                console.error(e);
                alert("Falha na comunicação com o Strava.");
            }
        }

        async function buscarTreinosReais(token) {
            toast("Buscando suas corridas...");
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const atividades = await response.json();
                
                let novos = 0;
                atividades.forEach(ativ => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === ativ.id);
                    if(ativ.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+ativ.id,
                            stravaId: ativ.id,
                            data: ativ.start_date,
                            tipo: 'Corrida Strava',
                            distancia: (ativ.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(ativ.moving_time),
                            status: 'concluido',
                            bpm: Math.round(ativ.average_heartrate || 0)
                        });
                        novos++;
                    }
                });

                atualizarInterface();
                document.getElementById('analise-texto').innerHTML = `✅ <b>Sucesso!</b><br>${novos} novos treinos importados diretamente do Strava/Zepp.`;
                toggleModal('modal-analise-coach');
            } catch (e) {
                alert("Erro ao ler atividades.");
            }
        }

        // --- HELPERS ---
        function formatarTempoLongo(segs) {
            const h = Math.floor(segs/3600).toString().padStart(2,'0'), 
                  m = Math.floor((segs%3600)/60).toString().padStart(2,'0'), 
                  s = Math.round(segs%60).toString().padStart(2,'0');
            return `${h}:${m}:${s}`;
        }
        function fDist(v) { let n = parseFloat(String(v).replace(',','.'))||0; let s = n.toFixed(1).replace('.',','); if(s.endsWith(',0')) s=s.split(',')[0]; if(s.startsWith('0,')&&s.length>2) s=s.substring(1); return s==='0'?',0':s; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toast(m) { const t = document.createElement('div'); t.className = "fixed bottom-5 right-5 bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black z-[100] animate-bounce shadow-2xl"; t.innerText = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

        function salvarPerfil() {
            appData.atleta.nome = document.getElementById('p-nome').value;
            appData.atleta.idade = parseInt(document.getElementById('p-idade').value);
            appData.atleta.peso = parseFloat(document.getElementById('p-peso').value);
            appData.atleta.stravaId = document.getElementById('strava-id').value;
            appData.atleta.stravaSecret = document.getElementById('strava-secret').value;
            
            toggleModal('modal-perfil');
            atualizarInterface();
            toast("Perfil e chaves Strava salvos!");
        }

        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (1.75 ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = imc;

            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(b.data) - new Date(a.data));
            lista.innerHTML = treinos.map(t => `
                <div class="p-5 rounded-[2.5rem] bg-white border flex items-center justify-between transition hover:shadow-md ${t.status === 'planejado' ? 'treino-planejado' : 'treino-concluido shadow-sm'} text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex flex-col items-center justify-center font-black ${t.status === 'planejado' ? 'bg-slate-50 text-slate-400' : 'bg-blue-50 text-blue-600'}">
                            <span class="text-[7px] uppercase tracking-tighter">${t.tipo.split(' ')[0]}</span>
                            <span class="text-lg">${fDist(t.distancia)}</span>
                        </div>
                        <div>
                            <h4 class="font-black text-xs uppercase text-slate-700">${new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">${t.tempo || 'Planejado'}</p>
                        </div>
                    </div>
                    <button onclick="removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
            
            localStorage.setItem('RunTrackElite_Final_Master', JSON.stringify(appData));
        }

        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
    </script>
</body>
</html>
