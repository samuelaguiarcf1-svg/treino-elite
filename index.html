<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V55 - Strava Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; background-color: #fcfdfe; }
        .treino-concluido { border-left: 8px solid #2563eb; background-color: #ffffff; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; border-color: #2563eb; }
        .dist-base { font-weight: 900; line-height: 1; }
        .dist-decimal { font-size: 0.6em; opacity: 0.5; font-weight: 700; vertical-align: baseline; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        .metric-card-detalhe { @apply bg-slate-50 p-4 rounded-[2rem] border border-slate-100 text-center transition-all hover:bg-white hover:shadow-md; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .scale-up { animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner">
                    <i class="fas fa-bolt text-blue-400"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Sincronização Strava V55</p>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">VO2 Máx</span>
                    <span class="text-xl font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">IMC</span>
                    <span class="text-xl font-black text-blue-400 font-mono-performance" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-cog text-white text-lg"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6 text-center">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase italic">Minha Agenda</h2>
                        <button onclick="iniciarConexaoStrava()" class="bg-orange-500 text-white px-6 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                            <i class="fab fa-strava text-lg"></i> SINCRONIZAR STRAVA
                        </button>
                    </div>
                    <div id="lista-treinos" class="space-y-4"></div>
                </div>
            </div>

            <!-- SIMULADOR -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic">Simulador Pace</h2>
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest text-center">Distância (km)</label>
                            <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarSimulador();" class="bg-transparent text-4xl font-black text-white text-center w-full outline-none font-mono-performance">
                        </div>
                        <div class="flex gap-2">
                            <input type="number" id="sim-pace-min" value="5" oninput="ajustarSimulador()" class="flex-1 bg-slate-800 p-3 rounded-2xl text-xl font-black text-center text-white outline-none">
                            <input type="number" id="sim-pace-seg" value="0" oninput="ajustarSimulador()" class="flex-1 bg-slate-800 p-3 rounded-2xl text-xl font-black text-center text-white outline-none">
                        </div>
                        <div class="bg-blue-600/10 p-5 rounded-3xl text-center border border-blue-500/20">
                            <span class="text-[8px] uppercase font-black text-blue-400 block mb-1">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40 uppercase tracking-tighter">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETALHES -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/98 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 md:p-12 shadow-2xl overflow-y-auto max-h-[90vh] scale-up">
            <div id="detalhes-header" class="text-center mb-8 border-b pb-6 border-slate-100"></div>
            <div id="detalhes-corpo" class="space-y-8 text-center"></div>
            <div class="mt-10">
                <button onclick="toggleModal('modal-detalhes')" class="w-full bg-slate-100 text-slate-500 py-4 rounded-2xl font-black uppercase text-xs">Sair</button>
            </div>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl text-slate-700">
            <h3 class="text-2xl font-black mb-6 text-center italic uppercase tracking-widest">Configuração Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 mb-2">
                    <label class="text-[9px] font-black uppercase text-orange-600 block mb-2 text-center">Dados da API do Strava</label>
                    <input type="text" id="strava-id" placeholder="Client ID" class="w-full p-4 bg-white rounded-xl border text-center font-bold mb-2 outline-none">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-4 bg-white rounded-xl border text-center font-bold outline-none">
                </div>
                <input type="text" id="p-nome" placeholder="Nome" class="w-full border-2 p-4 rounded-2xl font-bold text-center">
                <div class="grid grid-cols-2 gap-2"><input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl text-center"><input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl text-center"></div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Salvar Configurações</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO ---
        let appData = { atleta: { nome: "Atleta Elite", idade: 30, peso: 75, stravaId: "", stravaSecret: "" }, treinos: [] };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Master_V55');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('strava-id').value = appData.atleta.stravaId || "";
                document.getElementById('strava-secret').value = appData.atleta.stravaSecret || "";
            }

            // VERIFICA SE O URL CONTÉM UM CÓDIGO DO STRAVA
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) trocarCodigoPorToken(code);

            atualizarInterface();
            ajustarSimulador();
        };

        // --- LÓGICA STRAVA CORRIGIDA (AUTHORIZATION CODE FLOW) ---
        function iniciarConexaoStrava() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) return alert("Configure Client ID e Secret no Perfil!");
            
            const redirectUri = window.location.origin + window.location.pathname;
            const scope = "activity:read_all";
            // AGORA USAMOS response_type=code
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=${scope}`;
            
            window.location.href = authUrl;
        }

        async function trocarCodigoPorToken(code) {
            toast("Finalizando Sincronização...");
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId,
                        client_secret: appData.atleta.stravaSecret,
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                const data = await response.json();
                if (data.access_token) {
                    buscarTreinos(data.access_token);
                    window.history.pushState({}, document.title, window.location.pathname);
                }
            } catch (e) { alert("Falha na troca de chaves com o Strava."); }
        }

        async function buscarTreinos(token) {
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const activities = await response.json();
                
                activities.forEach(a => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === a.id);
                    if(a.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+a.id, stravaId: a.id, nomeOriginal: a.name,
                            data: a.start_date, status: 'concluido', distancia: (a.distance/1000).toFixed(2),
                            tempo: formatarTempoLongo(a.moving_time), bpm: Math.round(a.average_heartrate || 0),
                            telemetria: { 
                                ganhoElev: Math.round(a.total_elevation_gain), 
                                cadencia: Math.round(a.average_cadence * 2) || 0,
                                bpmMax: Math.round(a.max_heartrate || 0)
                            }
                        });
                    }
                });
                atualizarInterface();
                toast("✅ Treinos Importados!");
            } catch (e) { alert("Erro ao carregar treinos."); }
        }

        // --- INTERFACE E AUXILIARES ---
        function fDistHTML(v) {
            let n = parseFloat(String(v).replace(',','.'))||0;
            let s = n.toFixed(1).replace('.', ',');
            if (s.startsWith('0,')) s = s.substring(1);
            if (s.endsWith(',0')) s = s.split(',')[0];
            if (s.includes(',')) {
                let partes = s.split(',');
                return `<span class="dist-base">${partes[0]}</span><span class="dist-decimal">,${partes[1]}</span>`;
            }
            return `<span class="dist-base">${s}</span>`;
        }

        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (1.75 ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = isNaN(imc) ? "--" : imc;
            
            const concluidos = appData.treinos.filter(t => t.status === 'concluido');
            const totalKm = concluidos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('km-semana').innerHTML = fDistHTML(totalKm);
            document.getElementById('km-tenis').innerHTML = fDistHTML(totalKm);
            document.getElementById('barra-tenis').style.width = `${Math.min((totalKm/600)*100, 100)}%`;

            if(concluidos.length > 0) {
                const ref = concluidos[concluidos.length-1];
                document.getElementById('display-vo2').innerText = Math.round(((ref.distancia * 1000) / (tempoParaSegundos(ref.tempo)/60)) * 0.18 + 3.5);
            }
            renderizarAgenda();
            localStorage.setItem('RunTrackElite_Master_V55', JSON.stringify(appData));
        }

        function renderizarAgenda() {
            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(a.data) - new Date(b.data));
            lista.innerHTML = treinos.map(t => `
                <div class="p-5 rounded-[2.5rem] bg-white border-2 flex items-center justify-between transition hover:shadow-md cursor-pointer shadow-sm" onclick="abrirDetalhes('${t.id}')">
                    <div class="flex items-center gap-5 text-left">
                        <div class="w-14 h-14 rounded-2xl flex flex-col items-center justify-center font-black bg-blue-50 text-blue-600 shadow-inner">
                            <span class="text-[7px] uppercase tracking-tighter">KM</span>
                            <div class="text-xl">${fDistHTML(t.distancia)}</div>
                        </div>
                        <div>
                            <h4 class="font-black text-sm uppercase text-slate-700 truncate max-w-[200px]">${t.nomeOriginal || new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <div class="flex gap-2 mt-1">
                                <span class="metric-pill"><i class="fas fa-stopwatch text-blue-500"></i> ${t.tempo}</span>
                                <span class="metric-pill"><i class="fas fa-bolt text-yellow-500"></i> ${formatarPace(tempoParaSegundos(t.tempo)/t.distancia)}</span>
                                ${t.stravaId ? `<i class="fab fa-strava text-orange-500 text-xs"></i>` : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
        }

        function abrirDetalhes(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;
            const pace = formatarPace(tempoParaSegundos(t.tempo) / t.distancia);
            document.getElementById('detalhes-header').innerHTML = `<h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">${t.nomeOriginal}</h3><p class="text-slate-400 font-bold uppercase text-xs mt-1 font-mono-performance">${new Date(t.data).toLocaleDateString('pt-BR', {day: '2-digit', month: 'long', year: 'numeric'})}</p>`;

            let telHTML = "";
            if (t.telemetria) {
                telHTML = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                    <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">Subida</span><p class="text-2xl font-black text-orange-600">${t.telemetria.ganhoElev}m</p></div>
                    <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">Cadência</span><p class="text-2xl font-black text-blue-600">${t.telemetria.cadencia}</p></div>
                    <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">BPM Méd</span><p class="text-2xl font-black text-rose-500">${t.bpm}</p></div>
                    <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">BPM Máx</span><p class="text-2xl font-black text-rose-800">${t.telemetria.bpmMax}</p></div>
                </div>`;
            }
            document.getElementById('detalhes-corpo').innerHTML = `<div class="flex justify-around bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100 shadow-inner"><div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Distância</span><div class="text-2xl font-black">${fDistHTML(t.distancia)}</div></div><div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Tempo</span><div class="text-2xl font-black font-mono-performance">${t.tempo}</div></div><div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Ritmo</span><div class="text-2xl font-black text-blue-600 font-mono-performance">${pace}</div></div></div>${telHTML}`;
            toggleModal('modal-detalhes');
        }

        // --- HELPERS GERAIS ---
        function tempoParaSegundos(t) { const p = String(t).split(':').map(Number); if(p.length === 3) return (p[0]*3600)+(p[1]*60)+p[2]; return (p[0]*60)+p[1]; }
        function formatarTempoLongo(segs) { const h = Math.floor(segs / 3600).toString().padStart(2, '0'), m = Math.floor((segs % 3600) / 60).toString().padStart(2, '0'), s = Math.round(segs % 60).toString().padStart(2, '0'); return `${h}:${m}:${s}`; }
        function formatarPace(ps) { if(!ps || ps===Infinity) return "0:00"; const m = Math.floor(ps/60), s = Math.round(ps%60).toString().padStart(2,'0'); return `${m}:${s}`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function validarNumeros(el) { el.value = el.value.replace(/[^\d,]/g, ""); }
        function toast(m) { const t = document.createElement('div'); t.className = "fixed bottom-5 right-5 bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black z-[120] animate-bounce shadow-2xl"; t.innerText = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function ajustarSimulador() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) document.getElementById('sim-vel-res').innerText = (d/(p*d/3600)).toFixed(1).replace('.',',');
        }
        function ajustarPeloTempo() { ajustarSimulador(); }
        function alterarDistancia(delta) { const el = document.getElementById('sim-dist'); el.value = (parseFloat(el.value.replace(',','.'))+delta).toFixed(1); ajustarSimulador(); }
        function salvarPerfil() {
            appData.atleta = { nome: document.getElementById('p-nome').value, idade: parseInt(document.getElementById('p-idade').value), peso: parseFloat(document.getElementById('p-peso').value), stravaId: document.getElementById('strava-id').value, stravaSecret: document.getElementById('strava-secret').value, altura: 1.75 };
            toggleModal('modal-perfil'); atualizarInterface();
        }
        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
    </script>
</body>
</html>
