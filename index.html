<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite PRO - Master Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .strava-orange { color: #FC6100; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-orange-600">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fas fa-bolt text-white"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tighter uppercase leading-none" id="display-nome">Atleta Elite</h1>
                    <p class="text-[8px] text-orange-400 font-bold uppercase tracking-widest mt-1">Performance Pro</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-4 rounded-xl border border-slate-700 hidden md:block">
                    <span class="text-[7px] block uppercase opacity-50 font-black">VO2 Máx</span>
                    <span class="text-sm font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-slate-800 hover:bg-slate-700 p-2 px-4 rounded-xl transition border border-slate-600 text-xs font-bold uppercase">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LISTA DE TREINOS -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 uppercase italic">Histórico Analítico</h2>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Sincronização em tempo real</p>
                    </div>
                    <button onclick="iniciarConexaoStrava()" class="w-full md:w-auto bg-[#FC6100] text-white px-6 py-3 rounded-xl font-black text-[10px] tracking-widest hover:scale-105 transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fab fa-strava text-lg"></i> SINCRONIZAR AGORA
                    </button>
                </div>

                <div id="lista-treinos" class="space-y-3">
                    <div class="text-center py-20 text-slate-300 italic text-sm">Abra o perfil (engrenagem) e configure suas chaves do Strava.</div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD LATERAL -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-slate-900 rounded-[2rem] p-6 text-white shadow-xl">
                <h3 class="text-orange-500 font-black uppercase text-[9px] tracking-widest mb-4">Volume Total</h3>
                <div class="flex items-baseline gap-1">
                    <span class="text-5xl font-black tracking-tighter" id="total-km">0</span>
                    <span class="text-sm font-bold opacity-40">KM</span>
                </div>
                <div class="mt-6 pt-6 border-t border-white/10 grid grid-cols-2 gap-2 text-center">
                    <div><p class="text-[8px] font-black uppercase opacity-40">Atividades</p><p class="text-lg font-black" id="count-treinos">0</p></div>
                    <div><p class="text-[8px] font-black uppercase opacity-40">Pace Médio</p><p class="text-lg font-black font-mono-performance" id="pace-geral">--</p></div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm">
                <h3 class="text-slate-800 font-black uppercase text-[9px] tracking-widest mb-4 italic">Simulador de Ritmo</h3>
                <div class="space-y-3">
                    <div class="bg-slate-50 p-3 rounded-xl">
                        <label class="text-[8px] font-black text-slate-400 uppercase">Distância (KM)</label>
                        <input type="number" id="sim-dist" value="10" oninput="ajustarSimulador()" class="w-full bg-transparent text-xl font-black outline-none">
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1 bg-slate-50 p-3 rounded-xl">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Min</label>
                            <input type="number" id="sim-pace-min" value="5" oninput="ajustarSimulador()" class="w-full bg-transparent text-lg font-black outline-none">
                        </div>
                        <div class="flex-1 bg-slate-50 p-3 rounded-xl">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Seg</label>
                            <input type="number" id="sim-pace-seg" value="0" oninput="ajustarSimulador()" class="w-full bg-transparent text-lg font-black outline-none">
                        </div>
                    </div>
                    <div class="bg-blue-600 text-white p-4 rounded-xl text-center">
                        <span class="text-[8px] uppercase font-black opacity-60 block">Velocidade Requerida</span>
                        <p class="text-xl font-black"><span id="sim-vel-res">12,0</span> <small class="text-[10px]">KM/H</small></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE ANÁLISE -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-8 md:p-10 shadow-2xl overflow-y-auto max-h-[90vh] fade-in">
            <div id="detalhes-header" class="text-center mb-6"></div>
            <div id="detalhes-corpo" class="space-y-6"></div>
            <button onclick="toggleModal('modal-detalhes')" class="w-full mt-8 bg-slate-100 text-slate-500 py-4 rounded-xl font-black uppercase text-[10px]">Fechar Análise</button>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 text-center text-slate-800 uppercase italic">Configuração Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100">
                    <input type="text" id="strava-id" placeholder="Client ID" class="w-full p-3 mb-2 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-3 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                </div>
                <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border p-4 rounded-xl font-bold text-center outline-none text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-peso" placeholder="Peso (kg)" class="border p-4 rounded-xl font-bold text-center outline-none text-sm">
                    <input type="number" id="p-idade" placeholder="Idade" class="border p-4 rounded-xl font-bold text-center outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-[10px] shadow-lg">Salvar e Conectar</button>
            </form>
        </div>
    </div>

    <script>
        let appData = { atleta: { nome: "Atleta Elite", stravaId: "", stravaSecret: "", peso: 75, idade: 30 }, treinos: [] };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Master_V3');
            if (saved) appData = JSON.parse(saved);

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // Remove o código da URL para não processar duas vezes
                window.history.pushState({}, document.title, window.location.pathname);
                finalizarConexao(code);
            }
            atualizarInterface();
            ajustarSimulador();
        };

        function iniciarConexaoStrava() {
            const clientId = appData.atleta.stravaId.trim();
            if(!clientId) {
                alert("Configure seu Client ID no perfil!");
                toggleModal('modal-perfil');
                return;
            }
            const redirectUri = window.location.origin + window.location.pathname;
            const scope = "activity:read_all";
            // IMPORTANTE: response_type deve ser CODE
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=${scope}&approval_prompt=auto`;
            window.location.href = authUrl;
        }

        async function finalizarConexao(code) {
            toast("Autenticando...");
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId,
                        client_secret: appData.atleta.stravaSecret,
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                const data = await response.json();
                if(data.access_token) {
                    buscarAtividades(data.access_token);
                } else {
                    alert("Erro: Client Secret incorreto ou expirado.");
                }
            } catch (e) { alert("Erro na troca de tokens."); }
        }

        async function buscarAtividades(token) {
            toast("Processando dados...");
            try {
                const resp = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const activities = await resp.json();
                let novos = 0;
                activities.forEach(a => {
                    if(a.type === 'Run' && !appData.treinos.some(t => t.stravaId === a.id)) {
                        appData.treinos.unshift({
                            id: 'rt-' + Date.now() + Math.random(),
                            stravaId: a.id, nome: a.name, data: a.start_date,
                            distancia: (a.distance / 1000).toFixed(2),
                            tempoSegundos: a.moving_time,
                            bpm: Math.round(a.average_heartrate || 0),
                            telemetria: {
                                ganhoElev: Math.round(a.total_elevation_gain || 0),
                                cadencia: Math.round(a.average_cadence * 2) || 0
                            }
                        });
                        novos++;
                    }
                });
                atualizarInterface();
                toast(`✅ ${novos} novos treinos importados!`);
            } catch (e) { alert("Erro ao buscar atividades."); }
        }

        function abrirAnalise(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;

            const paceSegs = t.tempoSegundos / t.distancia;
            const paceMin = Math.floor(paceSegs / 60);
            const paceResto = Math.round(paceSegs % 60);
            const kmh = (t.distancia / (t.tempoSegundos / 3600)).toFixed(1);
            const eficiencia = t.bpm > 0 ? (kmh / t.bpm).toFixed(3) : "N/A";

            document.getElementById('detalhes-header').innerHTML = `
                <h3 class="text-2xl font-black text-slate-800 uppercase italic">${t.nome}</h3>
                <p class="text-slate-400 font-bold text-[9px] uppercase mt-2">${new Date(t.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'long'})}</p>
            `;

            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="grid grid-cols-3 gap-3 text-center bg-slate-900 text-white p-5 rounded-2xl">
                    <div><p class="text-[8px] opacity-50 uppercase">Distância</p><p class="text-xl font-black">${t.distancia}k</p></div>
                    <div><p class="text-[8px] opacity-50 uppercase">Ritmo</p><p class="text-xl font-black font-mono-performance text-blue-400">${paceMin}:${paceResto.toString().padStart(2,'0')}</p></div>
                    <div><p class="text-[8px] opacity-50 uppercase">Veloc.</p><p class="text-xl font-black">${kmh}</p></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-50 p-4 rounded-2xl border">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Eficiência (KMH/BPM)</p>
                        <p class="text-lg font-black text-emerald-500">${eficiencia}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Cadência</p>
                        <p class="text-lg font-black text-blue-500">${t.telemetria.cadencia || '--'}</p>
                    </div>
                </div>
                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100 text-xs leading-relaxed italic">
                    <i class="fas fa-lightbulb mr-2 text-orange-500"></i><b>Dica Coach:</b> 
                    ${t.telemetria.cadencia > 0 && t.telemetria.cadencia < 165 ? "Sua cadência está baixa. Tente passos mais curtos para diminuir o impacto." : "Bom desempenho aeróbico detectado."}
                </div>
            `;
            toggleModal('modal-detalhes');
        }

        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const totalKm = appData.treinos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('total-km').innerText = Math.round(totalKm);
            document.getElementById('count-treinos').innerText = appData.treinos.length;

            if(appData.treinos.length > 0) {
                const u = appData.treinos[0];
                const kmh = (u.distancia / (u.tempoSegundos / 3600));
                document.getElementById('display-vo2').innerText = Math.round((kmh * 16.6 * 0.18) + 3.5);
                
                document.getElementById('lista-treinos').innerHTML = appData.treinos.map(t => `
                    <div class="group bg-white border p-4 rounded-2xl flex items-center justify-between hover:border-orange-500 transition-all cursor-pointer" onclick="abrirAnalise('${t.id}')">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-slate-100 flex flex-col items-center justify-center font-black text-xs">
                                <span class="text-[6px] opacity-40 uppercase">KM</span>${t.distancia}
                            </div>
                            <div>
                                <h4 class="font-black text-[10px] uppercase truncate max-w-[140px]">${t.nome}</h4>
                                <div class="flex gap-2 mt-1">
                                    <span class="metric-pill">BPM: ${t.bpm || '--'}</span>
                                    <span class="metric-pill">CAD: ${t.telemetria.cadencia || '--'}</span>
                                </div>
                            </div>
                        </div>
                        <i class="fab fa-strava text-orange-500 opacity-30"></i>
                    </div>
                `).join('');
            }
            localStorage.setItem('RunTrackElite_Master_V3', JSON.stringify(appData));
        }

        function ajustarSimulador() {
            const d = parseFloat(document.getElementById('sim-dist').value) || 0;
            const m = parseInt(document.getElementById('sim-pace-min').value) || 0;
            const s = parseInt(document.getElementById('sim-pace-seg').value) || 0;
            const tempoTotalMin = (m * d) + (s * d / 60);
            if(tempoTotalMin > 0) document.getElementById('sim-vel-res').innerText = (d / (tempoTotalMin / 60)).toFixed(1).replace('.', ',');
        }

        function salvarPerfil() {
            appData.atleta.nome = document.getElementById('p-nome').value || "Atleta Elite";
            appData.atleta.stravaId = document.getElementById('strava-id').value.trim();
            appData.atleta.stravaSecret = document.getElementById('strava-secret').value.trim();
            appData.atleta.peso = document.getElementById('p-peso').value;
            toggleModal('modal-perfil');
            atualizarInterface();
            toast("Perfil Salvo!");
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-xl text-[9px] font-black z-[200] shadow-2xl fade-in uppercase tracking-widest";
            t.innerText = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
