<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite PRO - Master Sync v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Estilo da Tabela de Splits */
        .split-row:nth-child(even) { background-color: #f8fafc; }
        .split-km { font-weight: 900; color: #64748b; font-size: 10px; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b-2 border-orange-600">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fas fa-bolt text-white"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tighter uppercase leading-none" id="display-nome">Atleta Elite</h1>
                    <p class="text-[8px] text-orange-400 font-bold uppercase tracking-widest mt-1">Análise KM a KM</p>
                </div>
            </div>
            
            <button onclick="toggleModal('modal-perfil')" class="bg-slate-800 hover:bg-slate-700 p-2 px-4 rounded-xl transition border border-slate-600 text-xs font-bold uppercase">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- LISTA -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 uppercase italic">Meus Treinos</h2>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Clique para ver os parciais por KM</p>
                    </div>
                    <button onclick="iniciarConexaoStrava()" class="w-full md:w-auto bg-[#FC6100] text-white px-8 py-4 rounded-2xl font-black text-xs tracking-widest hover:scale-105 transition shadow-lg flex items-center justify-center gap-3">
                        <i class="fab fa-strava text-lg"></i> SINCRONIZAR STRAVA
                    </button>
                </div>
                <div id="lista-treinos" class="space-y-3"></div>
            </div>
        </div>

        <!-- DASHBOARD LATERAL -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl">
                <h3 class="text-orange-500 font-black uppercase text-[10px] tracking-widest mb-4 italic text-center">Resumo Total</h3>
                <div class="text-center">
                    <span class="text-6xl font-black tracking-tighter" id="total-km">0</span>
                    <span class="text-xl font-bold opacity-40">KM</span>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE ANÁLISE MINUCIOSA (COM SPLITS) -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] p-6 md:p-10 shadow-2xl overflow-y-auto max-h-[90vh] fade-in">
            <div id="detalhes-corpo">
                <!-- Conteúdo dos Splits entra aqui via JS -->
            </div>
            <button onclick="toggleModal('modal-detalhes')" class="w-full mt-6 bg-slate-100 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px]">Fechar Análise</button>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl text-center">
            <h3 class="text-xl font-black mb-6 text-slate-800 uppercase italic">Configuração</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-6 rounded-3xl border border-orange-100 space-y-2">
                    <input type="text" id="strava-id" placeholder="Client ID" class="w-full p-3 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-3 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                </div>
                <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border-2 p-4 rounded-2xl font-bold text-center outline-none">
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-xl">Salvar Perfil</button>
                <button type="button" onclick="limparTudo()" class="w-full bg-red-50 text-red-500 py-2 rounded-xl font-bold uppercase text-[8px]">Limpar Tudo</button>
            </form>
        </div>
    </div>

    <script>
        let appData = { atleta: { nome: "Atleta Elite", stravaId: "", stravaSecret: "" }, treinos: [] };
        let currentToken = ""; // Mantemos o token na sessão para buscar detalhes

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Master_VSplits');
            if (saved) appData = JSON.parse(saved);

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                window.history.pushState({}, document.title, window.location.pathname);
                finalizarConexao(code);
            }
            atualizarInterface();
        };

        function iniciarConexaoStrava() {
            const clientId = appData.atleta.stravaId.trim();
            if(!clientId) { alert("Configure seu ID no perfil!"); toggleModal('modal-perfil'); return; }
            const redirectUri = window.location.origin + window.location.pathname;
            window.location.href = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=activity:read_all&approval_prompt=auto`;
        }

        async function finalizarConexao(code) {
            toast("Autenticando...");
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId.trim(),
                        client_secret: appData.atleta.stravaSecret.trim(),
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                const data = await response.json();
                if(data.access_token) {
                    currentToken = data.access_token;
                    buscarAtividades(data.access_token);
                }
            } catch (e) { alert("Erro de token."); }
        }

        async function buscarAtividades(token) {
            toast("Buscando treinos...");
            try {
                const resp = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=20', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const activities = await resp.json();
                
                // Para cada atividade, buscamos o detalhe (Splits)
                for (let a of activities) {
                    if(a.type === 'Run' && !appData.treinos.some(t => t.stravaId === a.id)) {
                        // Busca detalhe do treino para pegar os splits
                        const detailResp = await fetch(`https://www.strava.com/api/v3/activities/${a.id}`, {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        const detail = await detailResp.json();

                        appData.treinos.unshift({
                            id: 'rt-' + Date.now() + Math.random(),
                            stravaId: a.id,
                            nome: a.name,
                            data: a.start_date,
                            distancia: (a.distance / 1000).toFixed(2),
                            tempoSegundos: a.moving_time,
                            bpm: Math.round(a.average_heartrate || 0),
                            cadencia: Math.round(a.average_cadence * 2) || 0,
                            elevacao: Math.round(a.total_elevation_gain || 0),
                            splits: detail.splits_metric || [] // AQUI ESTÃO OS DADOS POR KM
                        });
                    }
                }
                atualizarInterface();
                toast("Treinos com parciais importados!");
            } catch (e) { alert("Erro ao carregar detalhes."); }
        }

        function abrirAnalise(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;

            const paceTotal = formatarPace(t.tempoSegundos / t.distancia);
            
            // Gerar linhas da tabela de splits
            let splitsHTML = t.splits.map((s, index) => {
                const paceSplit = formatarPace(s.moving_time / (s.distance / 1000));
                const bpmSplit = Math.round(s.average_heartrate || 0);
                return `
                    <tr class="split-row border-b border-slate-100">
                        <td class="p-3 split-km">${index + 1} KM</td>
                        <td class="p-3 font-mono-performance text-[11px] font-bold text-blue-600">${paceSplit}</td>
                        <td class="p-3 font-mono-performance text-[11px] font-bold text-rose-500">${bpmSplit > 0 ? bpmSplit : '--'}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="text-center mb-6">
                    <h3 class="text-2xl font-black text-slate-800 uppercase italic leading-tight">${t.nome}</h3>
                    <p class="text-slate-400 font-bold text-[9px] uppercase mt-1">${new Date(t.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'long'})}</p>
                </div>

                <div class="grid grid-cols-3 gap-3 bg-slate-900 text-white p-5 rounded-[2rem] mb-6 text-center">
                    <div><p class="text-[8px] opacity-40 uppercase font-black">Total</p><p class="text-xl font-black">${t.distancia}k</p></div>
                    <div><p class="text-[8px] opacity-40 uppercase font-black">Pace Médio</p><p class="text-xl font-black text-blue-400 font-mono-performance">${paceTotal}</p></div>
                    <div><p class="text-[8px] opacity-40 uppercase font-black">Elevação</p><p class="text-xl font-black text-orange-400">${t.elevacao}m</p></div>
                </div>

                <h4 class="text-[10px] font-black uppercase text-slate-400 mb-3 tracking-widest"><i class="fas fa-list-ol mr-2"></i>Desempenho por Quilômetro</h4>
                <div class="bg-white border rounded-2xl overflow-hidden mb-6 shadow-inner">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-3 text-[8px] font-black uppercase text-slate-400">KM</th>
                                <th class="p-3 text-[8px] font-black uppercase text-slate-400">Ritmo</th>
                                <th class="p-3 text-[8px] font-black uppercase text-slate-400">FC Média</th>
                            </tr>
                        </thead>
                        <tbody>${splitsHTML}</tbody>
                    </table>
                </div>

                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100 text-[11px] leading-relaxed italic text-orange-800">
                    <i class="fas fa-chart-line mr-2"></i><b>Análise de Esforço:</b> 
                    ${t.bpm > 165 ? "Seu batimento médio está alto. Tente focar em treinos regenerativos para melhorar seu condicionamento." : "Ótima zona de esforço aeróbico mantida durante a atividade."}
                </div>
            `;
            toggleModal('modal-detalhes');
        }

        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const totalKm = appData.treinos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('total-km').innerText = Math.round(totalKm);

            if(appData.treinos.length > 0) {
                document.getElementById('lista-treinos').innerHTML = appData.treinos.map(t => `
                    <div class="group bg-white border-2 p-5 rounded-[2rem] flex items-center justify-between hover:border-orange-500 transition-all cursor-pointer shadow-sm" onclick="abrirAnalise('${t.id}')">
                        <div class="flex items-center gap-6">
                            <div class="w-14 h-14 rounded-2xl bg-slate-50 flex flex-col items-center justify-center font-black">
                                <span class="text-[7px] opacity-40 uppercase">KM</span><div class="text-xl leading-none font-black">${Math.floor(t.distancia)}</div>
                            </div>
                            <div class="text-left">
                                <h4 class="font-black text-xs uppercase text-slate-700 tracking-tight">${t.nome}</h4>
                                <div class="flex gap-2 mt-2">
                                    <span class="metric-pill">PACE: ${formatarPace(t.tempoSegundos/t.distancia)}</span>
                                    <span class="metric-pill">FC: ${t.bpm || '--'}</span>
                                </div>
                            </div>
                        </div>
                        <i class="fab fa-strava text-orange-500 opacity-20 group-hover:opacity-100"></i>
                    </div>
                `).join('');
            }
            localStorage.setItem('RunTrackElite_Master_VSplits', JSON.stringify(appData));
        }

        function formatarPace(segundosPorKm) {
            if(!segundosPorKm || segundosPorKm === Infinity) return "0:00";
            const m = Math.floor(segundosPorKm / 60);
            const s = Math.round(segundosPorKm % 60);
            return `${m}:${s.toString().padStart(2,'0')}`;
        }

        function ajustarSimulador() {
            const d = parseFloat(document.getElementById('sim-dist').value) || 0;
            const m = parseInt(document.getElementById('sim-pace-min').value) || 0;
            const s = parseInt(document.getElementById('sim-pace-seg').value) || 0;
            const tempoTotalMin = (m * d) + (s * d / 60);
            if(tempoTotalMin > 0) document.getElementById('sim-vel-res').innerText = (d / (tempoTotalMin / 60)).toFixed(1).replace('.', ',');
        }

        function salvarPerfil() {
            appData.atleta.nome = document.getElementById('p-nome').value || "Atleta Elite";
            appData.atleta.stravaId = document.getElementById('strava-id').value.trim();
            appData.atleta.stravaSecret = document.getElementById('strava-secret').value.trim();
            toggleModal('modal-perfil');
            atualizarInterface();
            toast("Perfil Atualizado!");
        }

        function limparTudo() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3 rounded-xl text-[9px] font-black z-[200] shadow-2xl fade-in uppercase";
            t.innerText = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
