<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V43 - Strava Real Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; }
        .treino-concluido { border-left: 8px solid #2563eb; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; border-color: #2563eb; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .btn-step { @apply text-slate-500 hover:text-blue-400 transition-colors text-xs py-1; }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner overflow-hidden">
                    <i id="avatar-icon" class="fas fa-user-ninja"></i>
                    <img id="avatar-img" src="" class="hidden w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Performance Lab</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div id="btn-zap-dia" class="hidden">
                    <button onclick="enviarTreinoDoDia()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-2xl font-black text-[10px] flex items-center gap-2 transition animate-pulse shadow-lg">
                        <i class="fab fa-whatsapp text-lg"></i> ENVIAR HOJE
                    </button>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">IMC</span>
                    <span class="text-xl font-black text-blue-400" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-user-cog"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- AGENDA -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase italic">Minha Agenda Elite</h2>
                        <div class="flex gap-2">
                            <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                                <i class="fab fa-strava text-lg"></i> SINCRONIZAR STRAVA
                            </button>
                            <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest shadow-lg uppercase">+ Planejar</button>
                        </div>
                    </div>
                    <div id="lista-treinos" class="space-y-6"></div>
                </div>
            </div>

            <!-- SIMULADOR PACE (ESTILO ORIGINAL PRESERVADO) -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic text-center">Simulador Pace</h2>
                    
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Distância (km)</label>
                            <div class="flex items-center justify-between px-2">
                                <button onclick="alterarDistancia(-0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-left"></i></button>
                                <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarPeloTempo();" class="bg-transparent text-4xl font-black text-white text-center w-24 outline-none font-mono">
                                <button onclick="alterarDistancia(0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-blue-400 block mb-2 tracking-widest">Pace Alvo (min : seg)</label>
                            <div class="flex items-center justify-center gap-4">
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('min', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-min" value="5" oninput="ajustarPeloPace()" class="box-input w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('min', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                                <span class="text-2xl font-black text-slate-700 mt-2">:</span>
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('seg', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-seg" value="0" oninput="ajustarPeloPace()" class="box-input w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('seg', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/10 text-center">
                            <label class="text-[9px] font-black uppercase text-emerald-400 block mb-2 tracking-widest">Tempo Final Alvo</label>
                            <div class="flex items-center justify-center gap-1">
                                <input type="number" id="sim-time-h" placeholder="h" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                                <span class="font-black text-slate-700">:</span>
                                <input type="number" id="sim-time-m" placeholder="min" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                                <span class="font-black text-slate-700">:</span>
                                <input type="number" id="sim-time-s" placeholder="seg" oninput="ajustarPeloTempo()" class="w-10 bg-slate-900 rounded-lg p-2 text-lg font-black text-center text-white outline-none">
                            </div>
                        </div>

                        <div class="bg-blue-600/10 p-4 rounded-3xl text-center border border-blue-500/20">
                            <span class="text-[8px] font-black text-blue-400 block mb-1">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAIS -->
    <!-- WIZARD -->
    <div id="modal-wizard" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 shadow-2xl overflow-y-auto max-h-[95vh]">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-8 uppercase italic">Setup de Ciclo de Performance</h3>
            <form onsubmit="event.preventDefault(); logicagerarPlanilhaElite();" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex flex-col bg-slate-50 p-4 rounded-3xl">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-1 text-center">Início</label>
                        <input type="date" id="wiz-data-inicio" onchange="atualizarPainelDuração()" class="bg-transparent font-bold text-center outline-none">
                    </div>
                    <div class="flex flex-col bg-slate-50 p-4 rounded-2xl border-2 border-blue-100">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-1 text-center">Data Prova</label>
                        <input type="date" id="wiz-data-prova" onchange="atualizarPainelDuração()" class="bg-transparent font-bold text-center outline-none text-rose-500">
                    </div>
                    <div class="flex flex-col bg-slate-50 p-4 rounded-2xl text-center">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-1">KM Alvo</label>
                        <input type="text" id="wiz-dist" value="10" oninput="validarNumeros(this)" class="bg-transparent text-xl font-black text-center outline-none text-blue-600">
                    </div>
                </div>

                <!-- PAINEL DE DURAÇÃO -->
                <div class="bg-slate-900 p-6 rounded-[2.5rem] border border-white/5">
                    <p class="text-center text-[10px] font-black uppercase text-slate-500 mb-4 tracking-widest italic text-center">Duração da Preparação</p>
                    <div class="flex gap-2 text-white">
                        <div class="bg-slate-800 p-3 rounded-2xl text-center flex-1"><span class="text-blue-400 text-xl font-black" id="dur-anos">0</span><p class="text-[7px] text-slate-500 font-bold uppercase">Anos</p></div>
                        <div class="bg-slate-800 p-3 rounded-2xl text-center flex-1"><span class="text-blue-400 text-xl font-black" id="dur-meses">0</span><p class="text-[7px] text-slate-500 font-bold uppercase">Meses</p></div>
                        <div class="bg-slate-800 p-3 rounded-2xl text-center flex-1"><span class="text-blue-400 text-xl font-black" id="dur-semanas">0</span><p class="text-[7px] text-slate-500 font-bold uppercase">Semanas</p></div>
                        <div class="bg-slate-800 p-3 rounded-2xl text-center flex-1"><span class="text-blue-400 text-xl font-black" id="dur-dias">0</span><p class="text-[7px] text-slate-500 font-bold uppercase">Dias</p></div>
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-3xl text-center">
                    <label class="text-[10px] font-black uppercase text-slate-500 block mb-2 tracking-widest">Tempo Alvo Final (HH:MM:SS)</label>
                    <input type="text" id="wiz-tempo" value="00:50:00" class="w-full bg-transparent text-4xl font-black text-center outline-none">
                </div>

                <div class="flex flex-wrap gap-2 justify-center">
                    <input type="checkbox" id="w0" value="0" class="hidden checkbox-day"><label for="w0" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Dom</label>
                    <input type="checkbox" id="w2" value="2" class="hidden checkbox-day" checked><label for="w2" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Ter</label>
                    <input type="checkbox" id="w4" value="4" class="hidden checkbox-day" checked><label for="w4" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Qui</label>
                    <input type="checkbox" id="w6" value="6" class="hidden checkbox-day" checked><label for="w6" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Sáb</label>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl">GERAR PLANILHA PERIODIZADA</button>
            </form>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center">Configurar Perfil</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <input type="text" id="p-nome" placeholder="Nome" class="w-full border-2 p-4 rounded-2xl text-center outline-none font-bold">
                
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200">
                    <label class="text-[9px] font-black uppercase text-orange-600 block mb-2 ml-1">Strava API</label>
                    <input type="text" id="strava-id" placeholder="Client ID do Strava" class="w-full p-3 text-xs border rounded-xl mb-2">
                </div>

                <div class="flex gap-2">
                    <input type="number" id="p-ddd" placeholder="DDD" class="w-16 p-3 bg-slate-50 border-2 rounded-xl text-center">
                    <input type="number" id="p-num" placeholder="Número WhatsApp" class="flex-1 p-3 bg-slate-50 border-2 rounded-xl text-center">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl text-center">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl text-center">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, ddd: "", num: "", stravaId: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_v43');
            if (saved) appData = JSON.parse(saved);
            
            // VERIFICA SE VOLTOU DO STRAVA
            const urlHash = window.location.hash;
            if (urlHash.includes("access_token=")) {
                const token = urlHash.split("access_token=")[1].split("&")[0];
                window.history.pushState({}, document.title, window.location.pathname);
                buscarDadosStravaReal(token);
            }

            document.getElementById('wiz-data-inicio').value = new Date().toISOString().split('T')[0];
            atualizarInterface();
            ajustarPeloPace();
        };

        // --- LÓGICA STRAVA REAL (Implicit Flow) ---
        function conectarStravaReal() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) return alert("Configure seu Strava Client ID no Perfil primeiro!");
            
            const redirectUri = window.location.href.split('#')[0];
            const scope = "activity:read_all";
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=token&scope=${scope}`;
            
            window.location.href = authUrl;
        }

        async function buscarDadosStravaReal(token) {
            toast("Conectando à Telemetria do Strava...");
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=5`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const atividades = await response.json();
                
                atividades.forEach(ativ => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === ativ.id);
                    if(ativ.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+ativ.id,
                            stravaId: ativ.id,
                            data: ativ.start_date,
                            tipo: 'Strava Run',
                            distancia: (ativ.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(ativ.moving_time),
                            status: 'concluido',
                            bpm: Math.round(ativ.average_heartrate || 0)
                        });
                    }
                });
                atualizarInterface();
                toast("✅ Atividades Sincronizadas!");
            } catch (e) {
                alert("Erro ao buscar dados. Verifique seu Client ID.");
            }
        }

        // --- ENGINE GERAÇÃO ---
        function logicagerarPlanilhaElite() {
            const dInVal = document.getElementById('wiz-data-inicio').value;
            const dPrVal = document.getElementById('wiz-data-prova').value;
            const distObj = parseFloat(document.getElementById('wiz-dist').value.replace(',', '.')) || 0;
            const tempoObj = document.getElementById('wiz-tempo').value;

            if(!dPrVal) return alert("Selecione a data da prova!");
            const dIn = new Date(dInVal); const dPr = new Date(dPrVal);
            const segsTotais = tempoParaSegundos(tempoObj);
            
            const diasCheck = Array.from(document.querySelectorAll('.checkbox-day:checked')).map(el => parseInt(el.value));
            if(diasCheck.length === 0) return alert("Selecione os dias de treino!");

            const paceAlvoSegs = segsTotais / distObj;
            const totalDias = Math.floor((dPr - dIn) / 86400000);
            const novas = [];

            for (let i = 0; i <= totalDias; i++) {
                let dAtual = new Date(dIn); dAtual.setDate(dIn.getDate() + i);
                let diaSemana = dAtual.getDay();

                if (diasCheck.includes(diaSemana) || i === totalDias) {
                    let perc = i/totalDias;
                    let tipo = (i === totalDias) ? "PROVA" : (diaSemana === 6 || diaSemana === 0 ? "Longão" : (diaSemana === 2 ? "Tiros" : "Rodagem"));
                    let fator = perc < 0.3 ? 0.7 : (perc < 0.8 ? 1.0 : 0.6);
                    let dReal = (tipo === "Longão") ? distObj * fator * 1.1 : distObj * 0.7;
                    if(tipo === "PROVA") dReal = distObj;
                    
                    novas.push({
                        id: 'el-'+Math.random().toString(36).substr(2,5),
                        data: dAtual.toISOString(), tipo: tipo, distancia: parseFloat(dReal).toFixed(1),
                        status: 'planejado', metaPace: formatarPace(paceAlvoSegs + (tipo === "Longão"?60:40)),
                        fase: perc < 0.3 ? "Base" : (perc < 0.8 ? "Build" : "Taper")
                    });
                }
            }
            appData.treinos = appData.treinos.filter(t => t.status === 'concluido').concat(novas);
            atualizarInterface();
            toggleModal('modal-wizard');
        }

        // --- LÓGICA SIMULADOR ---
        function stepPace(tipo, delta) {
            const el = document.getElementById(`sim-pace-${tipo}`);
            let val = (parseInt(el.value)||0) + delta;
            if(tipo==='seg') { if(val>59) val=0; if(val<0) val=59; }
            el.value = val; ajustarPeloPace();
        }
        function ajustarPeloPace() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) {
                const tot = p*d;
                document.getElementById('sim-time-h').value = Math.floor(tot/3600);
                document.getElementById('sim-time-m').value = Math.floor((tot%3600)/60);
                document.getElementById('sim-time-s').value = Math.round(tot%60);
                document.getElementById('sim-vel-res').innerText = (d/(tot/3600)).toFixed(1).replace('.',',');
            }
        }
        function ajustarPeloTempo() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const h = parseInt(document.getElementById('sim-time-h').value)||0;
            const m = parseInt(document.getElementById('sim-time-m').value)||0;
            const s = parseInt(document.getElementById('sim-time-s').value)||0;
            const tot = (h*3600)+(m*60)+s;
            if(d>0 && tot>0) {
                const p = tot/d;
                document.getElementById('sim-pace-min').value = Math.floor(p/60);
                document.getElementById('sim-pace-seg').value = Math.round(p%60);
                document.getElementById('sim-vel-res').innerText = (d/(tot/3600)).toFixed(1).replace('.',',');
            }
        }
        function alterarDistancia(delta) { const el = document.getElementById('sim-dist'); let v = parseFloat(el.value.replace(',','.'))||0; el.value = fDist(Math.max(0.1, v+delta)); ajustarPeloPace(); }

        // --- INTERFACE ---
        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (appData.atleta.altura ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = isNaN(imc) ? "--" : imc;
            document.getElementById('display-info').innerText = `${appData.atleta.idade} anos | ${appData.atleta.peso}kg`;
            document.getElementById('tenis-nome-tag').innerText = appData.atleta.stravaId ? "Conectado Strava" : "Manual";

            const concluidos = appData.treinos.filter(t => t.status === 'concluido');
            const totalKm = concluidos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('km-semana').innerText = fDist(totalKm);
            document.getElementById('km-tenis').innerText = fDist(totalKm);

            renderizarAgenda();
            localStorage.setItem('RunTrackElite_Final_v43', JSON.stringify(appData));
        }

        function renderizarAgenda() {
            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(a.data) - new Date(b.data));
            lista.innerHTML = treinos.map(t => `
                <div class="p-6 rounded-[2.5rem] bg-white border flex items-center justify-between transition hover:shadow-md ${t.status === 'planejado' ? 'treino-planejado' : 'treino-concluido shadow-sm'} text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex flex-col items-center justify-center font-black ${t.status === 'planejado' ? 'bg-slate-50 text-slate-400' : 'bg-blue-50 text-blue-600'}">
                            <span class="text-[7px] uppercase tracking-tighter">${t.tipo}</span>
                            <span class="text-lg">${fDist(t.distancia)}</span>
                        </div>
                        <div>
                            <h4 class="font-black text-xs uppercase text-slate-700">${new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">${t.status === 'concluido' ? t.tempo : `Meta: ${t.metaPace}`}</p>
                        </div>
                    </div>
                    <button onclick="removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt text-sm"></i></button>
                </div>
            `).join('');
        }

        function atualizarPainelDuração() {
            const d1 = new Date(document.getElementById('wiz-data-inicio').value);
            const d2 = new Date(document.getElementById('wiz-data-prova').value);
            if(isNaN(d1) || isNaN(d2) || d2 <= d1) return;
            const diff = d2 - d1;
            const dt = Math.floor(diff / 86400000);
            document.getElementById('dur-anos').innerText = Math.floor(dt / 365);
            document.getElementById('dur-meses').innerText = Math.floor((dt % 365) / 30);
            document.getElementById('dur-semanas').innerText = Math.floor(dt / 7);
            document.getElementById('dur-dias').innerText = dt % 30;
        }

        // --- HELPERS ---
        function fDist(v) { let n = parseFloat(String(v).replace(',','.'))||0; let s = n.toFixed(1).replace('.',','); if(s.endsWith(',0')) s=s.split(',')[0]; if(s.startsWith('0,')&&s.length>2) s=s.substring(1); return s==='0'?',0':s; }
        function validarNumeros(el) { el.value = el.value.replace(/[^\d,]/g, ""); }
        function tempoParaSegundos(t) { const p = t.split(':').map(Number); return p.length === 3 ? (p[0]*3600)+(p[1]*60)+p[2] : (p[0]*60)+p[1]; }
        function formatarPace(ps) { const m = Math.floor(ps/60), s = Math.round(ps%60).toString().padStart(2,'0'); return `${m}:${s}`; }
        function formatarTempoLongo(segs) { const h = Math.floor(segs/3600).toString().padStart(2,'0'), m = Math.floor((segs%3600)/60).toString().padStart(2,'0'), s = Math.round(segs%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function salvarPerfil() {
            appData.atleta = { nome: document.getElementById('p-nome').value, idade: parseInt(document.getElementById('p-idade').value), peso: parseFloat(document.getElementById('p-peso').value), stravaId: document.getElementById('strava-id').value, ddd: document.getElementById('p-ddd').value, num: document.getElementById('p-num').value, altura: 1.75 };
            toggleModal('modal-perfil'); atualizarInterface();
        }
        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
        function toast(m) { const t = document.createElement('div'); t.className = "fixed bottom-5 right-5 bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black z-[100] animate-bounce shadow-2xl"; t.innerText = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
    </script>
</body>
</html>
