<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V48 - Activity Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        
        .treino-planejado { border-left: 8px dashed #cbd5e1; }
        .treino-concluido { border-left: 8px solid #2563eb; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; }
        
        /* Estilização Garmin-Style */
        .dist-base { font-weight: 900; line-height: 1; }
        .dist-decimal { font-size: 0.6em; opacity: 0.5; font-weight: 700; vertical-align: baseline; }
        
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        
        .scale-up { animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner">
                    <i class="fas fa-user-ninja"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Performance Explorer Ativo</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">VO2 Máx</span>
                    <span class="text-xl font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black">IMC</span>
                    <span class="text-xl font-black text-blue-400 font-mono-performance" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-cog"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- DASHBOARD -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 text-center">
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2">KM Total</h3>
                <p class="text-4xl dist-base text-slate-800" id="km-semana">,0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-orange-500 md:col-span-3 text-left px-10 flex flex-col justify-center">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Tênis KM: <span id="tenis-nome-tag" class="text-orange-600 ml-2">--</span></h3>
                    <span class="text-[9px] font-bold text-slate-300">LIMITE 600KM</span>
                </div>
                <div class="flex items-center gap-6">
                    <p class="text-3xl dist-base" id="km-tenis">,0</p>
                    <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden shadow-inner"><div id="barra-tenis" class="bg-orange-500 h-full transition-all duration-1000 w-0"></div></div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- COLUNA AGENDA -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase italic">Cronograma</h2>
                        <div class="flex gap-2">
                            <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-5 py-3 rounded-2xl font-black text-[10px] hover:bg-orange-600 transition shadow-lg shadow-orange-100 flex items-center gap-2">
                                <i class="fab fa-strava text-lg"></i> SINCRONIZAR
                            </button>
                            <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] hover:bg-blue-700 transition shadow-lg uppercase">+ Planejar</button>
                        </div>
                    </div>
                    <div id="lista-treinos" class="space-y-4"></div>
                </div>
            </div>

            <!-- SIMULADOR PACE -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic">Simulador Pace</h2>
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Distância (km)</label>
                            <div class="flex items-center justify-between px-2">
                                <button onclick="alterarDistancia(-0.5)" class="text-slate-500 hover:text-white"><i class="fas fa-chevron-left"></i></button>
                                <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarPeloTempo();" class="bg-transparent text-4xl font-black text-white text-center w-24 outline-none font-mono-performance">
                                <button onclick="alterarDistancia(0.5)" class="text-slate-500 hover:text-white"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1 bg-slate-800 p-3 rounded-2xl text-center">
                                <label class="text-[8px] font-black uppercase text-slate-500 block mb-1">Min</label>
                                <input type="number" id="sim-pace-min" value="5" oninput="ajustarPeloPace()" class="bg-transparent w-full text-2xl font-black text-center text-white outline-none">
                            </div>
                            <div class="flex-1 bg-slate-800 p-3 rounded-2xl text-center">
                                <label class="text-[8px] font-black uppercase text-slate-500 block mb-1">Seg</label>
                                <input type="number" id="sim-pace-seg" value="0" oninput="ajustarPeloPace()" class="bg-transparent w-full text-2xl font-black text-center text-white outline-none">
                            </div>
                        </div>
                        <div class="bg-blue-600/10 p-5 rounded-3xl text-center border border-blue-500/20">
                            <span class="text-[8px] font-black text-blue-400 block mb-1 uppercase tracking-widest">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40 uppercase tracking-tighter">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETALHES DA ATIVIDADE (NOVO) -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] p-8 md:p-12 shadow-2xl overflow-y-auto max-h-[90vh] scale-up">
            <div id="detalhes-header" class="text-center mb-8 border-b pb-6 border-slate-100">
                <!-- Injetado via JS -->
            </div>
            
            <div id="detalhes-corpo" class="space-y-8">
                <!-- Injetado via JS -->
            </div>

            <div class="mt-10 flex gap-3">
                <button onclick="toggleModal('modal-detalhes')" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Fechar</button>
                <button id="btn-whats-detalhe" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-lg"></i> Enviar p/ Celular
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PERFIL E WIZARD (MANTIDOS) -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl text-center text-slate-700">
            <h3 class="text-2xl font-black mb-6">Configurações Atleta</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 mb-2">
                    <label class="text-[9px] font-black uppercase text-orange-600 block mb-2">Strava API</label>
                    <input type="text" id="strava-id" placeholder="Client ID" class="w-full p-3 text-xs border rounded-xl mb-2">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-3 text-xs border rounded-xl">
                </div>
                <input type="text" id="p-nome" placeholder="Nome" class="w-full border-2 p-4 rounded-2xl font-bold">
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl">
                    <input type="number" step="0.01" id="p-altura" placeholder="Alt m" class="border-2 p-4 rounded-2xl">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">SALVAR</button>
            </form>
        </div>
    </div>

    <div id="modal-wizard" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-8 uppercase italic">Setup de Ciclo</h3>
            <form onsubmit="event.preventDefault(); logicagerarPlanilhaElite();" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="date" id="wiz-data-inicio" class="p-4 bg-slate-50 rounded-2xl font-bold border">
                    <input type="date" id="wiz-data-prova" class="p-4 bg-slate-50 rounded-2xl font-bold border text-rose-500">
                    <input type="text" id="wiz-dist" value="10" placeholder="KM" oninput="validarNumeros(this)" class="p-4 bg-slate-50 rounded-2xl font-black border text-blue-600 text-center">
                </div>
                <input type="text" id="wiz-tempo" value="00:50:00" placeholder="00:50:00" class="w-full p-6 bg-slate-50 rounded-3xl text-3xl font-black text-center border-none">
                <div class="flex flex-wrap gap-2 justify-center">
                    <input type="checkbox" id="w2" value="2" class="hidden checkbox-day" checked><label for="w2" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Ter</label>
                    <input type="checkbox" id="w4" value="4" class="hidden checkbox-day" checked><label for="w4" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Qui</label>
                    <input type="checkbox" id="w6" value="6" class="hidden checkbox-day" checked><label for="w6" class="w-16 text-center p-3 border-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase">Sáb</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black uppercase text-xs">GERAR PLANILHA</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO INICIAL ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, stravaId: "", stravaSecret: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_Fidelity_V48');
            if (saved) appData = JSON.parse(saved);
            
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if(code) processarTrocaDeToken(code);

            document.getElementById('wiz-data-inicio').value = new Date().toISOString().split('T')[0];
            atualizarInterface();
            ajustarPeloPace();
        };

        // --- LÓGICA DE DETALHES ---
        function abrirDetalhes(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;

            const segs = tempoParaSegundos(t.tempo || t.metaPace);
            const paceFinal = formatarPace(segs / t.distancia);

            // Cabeçalho do Detalhe
            document.getElementById('detalhes-header').innerHTML = `
                <span class="bg-blue-100 text-blue-600 text-[10px] font-black px-4 py-1 rounded-full uppercase tracking-widest mb-2 inline-block">${t.status === 'planejado' ? 'Planejamento' : 'Atividade Realizada'}</span>
                <h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">${t.nomeOriginal || t.tipo}</h3>
                <p class="text-slate-400 font-bold uppercase text-xs mt-1">${new Date(t.data).toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'})}</p>
            `;

            // Corpo do Detalhe
            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-slate-50 p-6 rounded-[2rem] text-center border border-slate-100">
                        <span class="text-[8px] font-black text-slate-400 uppercase">Distância</span>
                        <p class="text-3xl dist-base text-slate-800 mt-1">${fDistHTML(t.distancia)}<small class="text-xs ml-1">km</small></p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-[2rem] text-center border border-slate-100">
                        <span class="text-[8px] font-black text-slate-400 uppercase">Tempo</span>
                        <p class="text-2xl font-black text-slate-800 mt-1 font-mono-performance">${t.tempo || t.metaPace + ':00'}</p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-[2rem] text-center border border-slate-100">
                        <span class="text-[8px] font-black text-slate-400 uppercase">Ritmo Médio</span>
                        <p class="text-2xl font-black text-blue-600 mt-1 font-mono-performance">${paceFinal}</p>
                    </div>
                </div>

                ${t.telemetria ? `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="metric-pill justify-center p-3 text-sm border bg-white shadow-sm font-mono-performance"><i class="fas fa-mountain text-orange-500"></i> ${t.telemetria.ganhoElev}m</div>
                    <div class="metric-pill justify-center p-3 text-sm border bg-white shadow-sm font-mono-performance"><i class="fas fa-shoe-prints text-blue-500"></i> ${t.telemetria.cadencia} ppm</div>
                    <div class="metric-pill justify-center p-3 text-sm border bg-white shadow-sm font-mono-performance"><i class="fas fa-heartbeat text-rose-500"></i> ${t.bpm} bpm</div>
                    <div class="metric-pill justify-center p-3 text-sm border bg-white shadow-sm font-mono-performance"><i class="fas fa-fire text-orange-600"></i> ${t.telemetria.bpmMax || '--'} máx</div>
                </div>
                ` : ''}

                <div class="coach-note p-6 rounded-[2.5rem] space-y-4">
                    <p class="font-black uppercase text-xs flex items-center gap-2"><i class="fas fa-clipboard-check"></i> Instruções do Coach Elite:</p>
                    <div class="text-sm leading-relaxed opacity-90 italic">
                        "Este treino de <b>${t.tipo}</b> foi desenhado para ${t.tipo === 'Longão' ? 'melhorar sua resistência de base' : 'aumentar seu VO2 máximo'}. 
                        Mantenha o pace de <b>${paceFinal}</b> para garantir que você está na zona metabólica correta."
                    </div>
                </div>
            `;

            document.getElementById('btn-whats-detalhe').onclick = () => enviarWhatsApp(t);
            toggleModal('modal-detalhes');
        }

        // --- LÓGICA DE FORMATAÇÃO PREMIUM ---
        function fDistHTML(v) {
            let n = parseFloat(String(v).replace(',','.'))||0;
            if (n === 0) return "0";
            let s = n.toFixed(1).replace('.', ',');
            if (s.startsWith('0,')) s = s.substring(1);
            if (s.endsWith(',0')) s = s.split(',')[0];
            if (s.includes(',')) {
                let partes = s.split(',');
                return `<span class="dist-base">${partes[0]}</span><span class="dist-decimal">,${partes[1]}</span>`;
            }
            return `<span class="dist-base">${s}</span>`;
        }

        // --- INTERFACE ---
        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (appData.atleta.altura ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = isNaN(imc) ? "--" : imc;
            
            const concluidos = appData.treinos.filter(t => t.status === 'concluido');
            const totalKm = concluidos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('km-semana').innerHTML = fDistHTML(totalKm);
            document.getElementById('km-tenis').innerHTML = fDistHTML(totalKm);
            document.getElementById('barra-tenis').style.width = `${Math.min((totalKm/600)*100, 100)}%`;

            if(concluidos.length > 0) {
                const ref = concluidos[concluidos.length-1];
                const segs = tempoParaSegundos(ref.tempo);
                document.getElementById('display-vo2').innerText = Math.round(((ref.distancia * 1000) / (segs/60)) * 0.18 + 3.5);
            }
            renderizarAgenda();
            localStorage.setItem('RunTrackElite_Final_Fidelity_V48', JSON.stringify(appData));
        }

        function renderizarAgenda() {
            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(a.data) - new Date(b.data));
            lista.innerHTML = treinos.map(t => {
                let paceCalculado = "";
                if (t.status === 'concluido' && t.distancia > 0) {
                    paceCalculado = formatarPace(tempoParaSegundos(t.tempo) / t.distancia);
                }
                return `
                <div class="group relative p-5 rounded-[2.5rem] bg-white border-2 flex items-center justify-between transition hover:border-blue-200 cursor-pointer ${t.status === 'planejado' ? 'treino-planejado' : 'treino-concluido shadow-sm'}" onclick="abrirDetalhes('${t.id}')">
                    <div class="flex items-center gap-5">
                        <div class="w-16 h-16 rounded-3xl flex flex-col items-center justify-center font-black ${t.status === 'planejado' ? 'bg-slate-50 text-slate-300' : 'bg-blue-50 text-blue-600 shadow-inner'}">
                            <span class="text-[7px] uppercase tracking-tighter">KM</span>
                            <div class="text-xl">${fDistHTML(t.distancia)}</div>
                        </div>
                        <div>
                            <h4 class="font-black text-sm uppercase text-slate-700 tracking-tighter">${t.nomeOriginal || new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="metric-pill"><i class="fas fa-stopwatch text-blue-500"></i> ${t.tempo || t.metaPace}</span>
                                ${paceCalculado ? `<span class="metric-pill"><i class="fas fa-bolt text-yellow-500"></i> ${paceCalculado}</span>` : ''}
                                ${t.stravaId ? `<i class="fab fa-strava text-orange-500 text-xs"></i>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fas fa-chevron-right text-slate-200 group-hover:text-blue-400 transition-colors"></i>
                        <button onclick="event.stopPropagation(); removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt text-sm"></i></button>
                    </div>
                </div>
            `}).join('');
        }

        // --- LÓGICA STRAVA E OUTROS ---
        function conectarStravaReal() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) return alert("Configure Strava Client ID no Perfil.");
            const red = window.location.href.split('?')[0]; 
            window.location.href = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${red}&response_type=code&scope=activity:read_all`;
        }

        async function processarTrocaDeToken(code) {
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: appData.atleta.stravaId, client_secret: appData.atleta.stravaSecret, code: code, grant_type: 'authorization_code' })
                });
                const data = await response.json();
                if(data.access_token) {
                    buscarTreinosReais(data.access_token);
                    window.history.pushState({}, document.title, window.location.pathname);
                }
            } catch (e) { console.error(e); }
        }

        async function buscarTreinosReais(token) {
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=15`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const atividades = await response.json();
                atividades.forEach(ativ => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === ativ.id);
                    if(ativ.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+ativ.id, stravaId: ativ.id, nomeOriginal: ativ.name,
                            data: ativ.start_date, status: 'concluido', distancia: (ativ.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(ativ.moving_time), bpm: Math.round(ativ.average_heartrate || 0),
                            telemetria: { ganhoElev: Math.round(ativ.total_elevation_gain), cadencia: Math.round(ativ.average_cadence * 2) || 0, bpmMax: Math.round(ativ.max_heartrate || 0) }
                        });
                    }
                });
                atualizarInterface();
            } catch (e) { console.error(e); }
        }

        // --- HELPERS GERAIS ---
        function tempoParaSegundos(t) { const p = String(t).split(':').map(Number); return p.length === 3 ? (p[0]*3600)+(p[1]*60)+p[2] : (p[0]*60)+p[1]; }
        function formatarTempoLongo(segs) { const h = Math.floor(segs/3600).toString().padStart(2,'0'), m = Math.floor((segs%3600)/60).toString().padStart(2,'0'), s = Math.round(segs%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; }
        function formatarPace(ps) { if(!ps || ps===Infinity) return "0:00"; const m = Math.floor(ps/60), s = Math.round(ps%60).toString().padStart(2,'0'); return `${m}:${s}`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function validarNumeros(el) { el.value = el.value.replace(/[^\d,]/g, ""); }
        function alterarDistancia(delta) { const el = document.getElementById('sim-dist'); let v = parseFloat(el.value.replace(',','.'))||0; el.value = v+delta; ajustarPeloPace(); }
        function ajustarPeloPace() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) document.getElementById('sim-vel-res').innerText = (d/(p*d/3600)).toFixed(1).replace('.',',');
        }
        function ajustarPeloTempo() { ajustarPeloPace(); }
        function logicagerarPlanilhaElite() { alert("Gerando plano..."); toggleModal('modal-wizard'); }
        function salvarPerfil() {
            appData.atleta = { nome: document.getElementById('p-nome').value, idade: parseInt(document.getElementById('p-idade').value), peso: parseFloat(document.getElementById('p-peso').value), stravaId: document.getElementById('strava-id').value, stravaSecret: document.getElementById('strava-secret').value, altura: document.getElementById('p-altura').value };
            toggleModal('modal-perfil'); atualizarInterface();
        }
        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
        function enviarWhatsApp(t) { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Treino: ' + t.tipo)}`, '_blank'); }
    </script>
</body>
