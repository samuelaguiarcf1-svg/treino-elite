<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V55 - Total Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; background-color: #fcfdfe; }
        .treino-concluido { border-left: 8px solid #2563eb; background-color: #ffffff; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; border-color: #2563eb; }
        .dist-base { font-weight: 900; line-height: 1; }
        .dist-decimal { font-size: 0.6em; opacity: 0.5; font-weight: 700; vertical-align: baseline; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .metric-card-detalhe { @apply bg-slate-50 p-4 rounded-[2rem] border border-slate-100 text-center transition-all hover:bg-white hover:shadow-md; }
        .btn-step { @apply text-slate-500 hover:text-blue-400 transition-colors text-xs py-1; }
        .split-row:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div id="avatar-container" class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner">
                    <i class="fas fa-user-ninja"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Total Telemetry Active</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black tracking-tighter">VO2 Máx</span>
                    <span class="text-xl font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black tracking-tighter">IMC</span>
                    <span class="text-xl font-black text-blue-400 font-mono-performance" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-id-card"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- DASHBOARD -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 text-center text-slate-800">
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2">Volume Total</h3>
                <p class="text-4xl" id="km-semana">,0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-orange-500 md:col-span-3 text-left px-10 flex flex-col justify-center">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Desgaste Tênis</h3>
                    <span class="text-[9px] font-bold text-slate-300 uppercase italic">Limite 600km</span>
                </div>
                <div class="flex items-center gap-6">
                    <p class="text-3xl" id="km-tenis">,0</p>
                    <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden shadow-inner"><div id="barra-tenis" class="bg-orange-500 h-full transition-all duration-1000 w-0"></div></div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase italic">Minha Agenda</h2>
                        <div class="flex gap-2">
                            <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                                <i class="fab fa-strava text-lg"></i> SINCRONIZAR
                            </button>
                            <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] shadow-lg uppercase transition hover:bg-blue-700">+ Planejar</button>
                        </div>
                    </div>
                    <div id="lista-treinos" class="space-y-4 text-center"></div>
                </div>
            </div>

            <!-- SIMULADOR PACE (MANTIDO) -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic">Simulador Pace</h2>
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Distância (km)</label>
                            <div class="flex items-center justify-between px-2">
                                <button onclick="alterarDistancia(-0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-left"></i></button>
                                <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarPeloTempo();" class="bg-transparent text-4xl font-black text-white text-center w-24 outline-none font-mono-performance">
                                <button onclick="alterarDistancia(0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-blue-400 block mb-2 tracking-widest">Pace Alvo (min : seg)</label>
                            <div class="flex items-center justify-center gap-4">
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('min', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-min" value="5" oninput="ajustarPeloPace()" class="w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('min', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                                <span class="text-2xl font-black text-slate-700 mt-2">:</span>
                                <div class="flex flex-col items-center">
                                    <button onclick="stepPace('seg', 1)" class="btn-step"><i class="fas fa-chevron-up"></i></button>
                                    <input type="number" id="sim-pace-seg" value="0" oninput="ajustarPace()" class="w-14 bg-slate-900 rounded-xl p-3 text-2xl font-black text-center text-white outline-none">
                                    <button onclick="stepPace('seg', -1)" class="btn-step"><i class="fas fa-chevron-down"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="bg-blue-600/10 p-5 rounded-3xl text-center border border-blue-500/20 shadow-inner">
                            <span class="text-[8px] font-black text-blue-400 block mb-1">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40 uppercase tracking-tighter">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETALHES COM SPLITS POR KM -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/98 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 md:p-12 shadow-2xl overflow-y-auto max-h-[90vh] scale-up">
            <div id="detalhes-header" class="text-center mb-8 border-b pb-6 border-slate-100"></div>
            
            <div id="detalhes-corpo" class="space-y-8">
                <!-- Sumário Injetado -->
            </div>

            <!-- TABELA DE SPLITS POR KM -->
            <div class="mt-8">
                <h4 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest flex items-center gap-2">
                    <i class="fas fa-list-ol text-blue-600"></i> Splits por Quilômetro
                </h4>
                <div class="overflow-hidden rounded-3xl border border-slate-100">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900 text-white uppercase text-[9px] tracking-widest">
                            <tr>
                                <th class="p-4">KM</th>
                                <th class="p-4">Pace</th>
                                <th class="p-4">BPM</th>
                                <th class="p-4">Cadência</th>
                            </tr>
                        </thead>
                        <tbody id="detalhes-splits-body" class="font-mono-performance text-slate-700 text-sm">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-10">
                <button onclick="toggleModal('modal-detalhes')" class="w-full bg-slate-100 text-slate-500 py-5 rounded-2xl font-black uppercase text-xs tracking-widest">Fechar Explorer</button>
            </div>
        </div>
    </div>

    <!-- MODAIS AUXILIARES -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center italic">Perfil & Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 space-y-2">
                    <label class="text-[9px] font-black uppercase text-orange-600">Strava Client ID</label>
                    <input type="text" id="strava-id" placeholder="ID da sua API" class="w-full p-3 bg-white border rounded-xl outline-none text-center">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-3 bg-white border rounded-xl outline-none text-center">
                </div>
                <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border-2 p-4 rounded-2xl font-bold text-center">
                <div class="grid grid-cols-2 gap-2 text-center">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl text-center">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl text-center">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, stravaId: "", stravaSecret: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_V55');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('strava-id').value = appData.atleta.stravaId || "";
                document.getElementById('strava-secret').value = appData.atleta.stravaSecret || "";
            }
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if(code) processarTrocaDeToken(code);
            atualizarInterface();
            ajustarPeloPace();
        };

        // --- MOTOR STRAVA COM SPLITS ---
        function conectarStravaReal() {
            const cid = appData.atleta.stravaId;
            if(!cid) return alert("Configure Strava no Perfil.");
            const red = window.location.origin + window.location.pathname; 
            window.location.href = `https://www.strava.com/oauth/authorize?client_id=${cid}&redirect_uri=${red}&response_type=code&scope=activity:read_all`;
        }

        async function processarTrocaDeToken(code) {
            try {
                const res = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: appData.atleta.stravaId, client_secret: appData.atleta.stravaSecret, code: code, grant_type: 'authorization_code' })
                });
                const d = await res.json();
                if(d.access_token) {
                    buscarTreinosComSplits(d.access_token);
                    window.history.pushState({}, document.title, window.location.pathname);
                }
            } catch (e) { console.error(e); }
        }

        async function buscarTreinosComSplits(token) {
            toast("Buscando Telemetria Avançada...");
            try {
                const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=20`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const list = await res.json();
                
                // Para cada atividade, buscamos o detalhe para obter os splits
                for (let a of list) {
                    const jaExiste = appData.treinos.some(t => t.stravaId === a.id);
                    if(a.type === 'Run' && !jaExiste) {
                        // Busca o detalhe da atividade individual
                        const detailRes = await fetch(`https://www.strava.com/api/v3/activities/${a.id}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const detail = await detailRes.json();

                        appData.treinos.push({
                            id: 'str-'+detail.id, stravaId: detail.id, nomeOriginal: detail.name,
                            data: detail.start_date, status: 'concluido', distancia: (detail.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(detail.moving_time), bpm: Math.round(detail.average_heartrate || 0),
                            telemetria: { 
                                ganhoElev: Math.round(detail.total_elevation_gain), 
                                cadencia: Math.round(detail.average_cadence * 2) || 0,
                                bpmMax: Math.round(detail.max_heartrate || 0),
                                splits: detail.splits_metric.map(s => ({
                                    dist: s.distance,
                                    pace: formatarPace(s.moving_time / (s.distance/1000)),
                                    bpm: Math.round(s.average_heartrate || 0),
                                    cad: Math.round(s.average_cadence * 2 || 0)
                                }))
                            }
                        });
                    }
                }
                atualizarInterface();
            } catch (e) { console.error(e); }
        }

        // --- DETALHES ---
        function abrirDetalhes(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;
            const paceFinal = formatarPace(tempoParaSegundos(t.tempo) / t.distancia);

            document.getElementById('detalhes-header').innerHTML = `
                <h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">${t.nomeOriginal || t.tipo}</h3>
                <p class="text-slate-400 font-bold uppercase text-xs mt-1">${new Date(t.data).toLocaleDateString('pt-BR', {day: '2-digit', month: 'long', year: 'numeric'})}</p>
            `;

            let teleHTML = "";
            let splitsHTML = "";

            if (t.stravaId && t.telemetria) {
                const tel = t.telemetria;
                teleHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">Subida</span><p class="text-2xl font-black text-orange-600">${tel.ganhoElev}m</p></div>
                        <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">Cadência</span><p class="text-2xl font-black text-blue-600">${tel.cadencia}</p></div>
                        <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">BPM Méd</span><p class="text-2xl font-black text-rose-500">${t.bpm}</p></div>
                        <div class="metric-card-detalhe"><span class="text-[8px] font-black text-slate-400 uppercase">BPM Máx</span><p class="text-2xl font-black text-rose-800">${tel.bpmMax}</p></div>
                    </div>
                `;

                if(tel.splits) {
                    splitsHTML = tel.splits.map((s, i) => `
                        <tr class="split-row border-b border-slate-50">
                            <td class="p-4 font-black text-slate-400">${i+1}</td>
                            <td class="p-4 font-black text-blue-600">${s.pace}</td>
                            <td class="p-4 font-bold text-rose-500">${s.bpm || '--'}</td>
                            <td class="p-4 text-slate-500">${s.cad || '--'}</td>
                        </tr>
                    `).join('');
                }
            }

            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="flex justify-around bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100 shadow-inner">
                    <div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Distância</span><div class="text-2xl font-black">${fDistHTML(t.distancia)}</div></div>
                    <div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Tempo</span><div class="text-2xl font-black font-mono-performance">${t.tempo}</div></div>
                    <div class="text-center"><span class="text-[9px] font-black text-slate-400 uppercase">Pace</span><div class="text-2xl font-black text-blue-600 font-mono-performance">${paceFinal}</div></div>
                </div>
                ${teleHTML}
            `;
            document.getElementById('detalhes-splits-body').innerHTML = splitsHTML || '<tr><td colspan="4" class="p-10 text-center opacity-30 uppercase font-black">Dados não disponíveis</td></tr>';
            toggleModal('modal-detalhes');
        }

        // --- INTERFACE ---
        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (1.75 ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = imc;
            document.getElementById('display-info').innerText = `${appData.atleta.idade} anos | ${appData.atleta.peso}kg`;
            
            const concluidos = appData.treinos.filter(t => t.status === 'concluido');
            const totalKm = concluidos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('km-semana').innerHTML = fDistHTML(totalKm);
            document.getElementById('km-tenis').innerHTML = fDistHTML(totalKm);
            document.getElementById('barra-tenis').style.width = `${Math.min((totalKm/600)*100, 100)}%`;

            if(concluidos.length > 0) {
                const ref = concluidos[concluidos.length-1];
                document.getElementById('display-vo2').innerText = Math.round(((ref.distancia * 1000) / (tempoParaSegundos(ref.tempo)/60)) * 0.18 + 3.5);
            }
            renderizarAgenda();
            localStorage.setItem('RunTrackElite_Final_V55', JSON.stringify(appData));
        }

        function renderizarAgenda() {
            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(a.data) - new Date(b.data));
            lista.innerHTML = treinos.map(t => `
                <div class="group p-5 rounded-[2.5rem] bg-white border flex items-center justify-between transition hover:border-blue-200 cursor-pointer shadow-sm" onclick="abrirDetalhes('${t.id}')">
                    <div class="flex items-center gap-5 text-left">
                        <div class="w-14 h-14 rounded-2xl flex flex-col items-center justify-center font-black bg-blue-50 text-blue-600 shadow-inner">
                            <span class="text-[7px] uppercase tracking-tighter">KM</span>
                            <div class="text-xl">${fDistHTML(t.distancia)}</div>
                        </div>
                        <div>
                            <h4 class="font-black text-sm uppercase text-slate-700 truncate max-w-[180px]">${t.nomeOriginal || new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <div class="flex gap-2 mt-1">
                                <span class="metric-pill"><i class="fas fa-stopwatch text-blue-500"></i> ${t.tempo}</span>
                                <span class="metric-pill"><i class="fas fa-bolt text-yellow-500"></i> ${formatarPace(tempoParaSegundos(t.tempo)/t.distancia)}</span>
                                ${t.stravaId ? `<i class="fab fa-strava text-orange-500 text-xs"></i>` : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt text-sm"></i></button>
                </div>
            `).join('');
        }

        // --- HELPERS ---
        function fDistHTML(v) {
            let n = parseFloat(String(v).replace(',','.'))||0;
            let s = n.toFixed(1).replace('.', ',');
            if (s.startsWith('0,')) s = s.substring(1);
            if (s.endsWith(',0')) s = s.split(',')[0];
            if (s.includes(',')) {
                let partes = s.split(',');
                return `<span class="dist-base">${partes[0]}</span><span class="dist-decimal">,${partes[1]}</span>`;
            }
            return `<span class="dist-base">${s}</span>`;
        }
        function tempoParaSegundos(t) { const p = String(t).split(':').map(Number); return p.length === 3 ? (p[0]*3600)+(p[1]*60)+p[2] : (p[0]*60)+p[1]; }
        function formatarTempoLongo(segs) { const h = Math.floor(segs/3600).toString().padStart(2,'0'), m = Math.floor((segs%3600)/60).toString().padStart(2,'0'), s = Math.round(segs%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; }
        function formatarPace(ps) { if(!ps || ps===Infinity) return "0:00"; const m = Math.floor(ps/60), s = Math.round(ps%60).toString().padStart(2,'0'); return `${m}:${s}`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function validarNumeros(el) { el.value = el.value.replace(/[^\d,]/g, ""); }
        function toast(m) { const t = document.createElement('div'); t.className = "fixed bottom-5 right-5 bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black z-[120] animate-bounce shadow-2xl"; t.innerText = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function stepPace(tipo, delta) { const el = document.getElementById(`sim-pace-${tipo}`); let v = (parseInt(el.value)||0)+delta; if(tipo==='seg'){if(v>59)v=0;if(v<0)v=59;} el.value=v; ajustarPeloPace(); }
        function ajustarPeloPace() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) document.getElementById('sim-vel-res').innerText = (d/(p*d/3600)).toFixed(1).replace('.',,');
        }
        function ajustarPeloTempo() { ajustarPeloPace(); }
        function alterarDistancia(delta) { const el = document.getElementById('sim-dist'); el.value = (parseFloat(el.value.replace(',','.'))+delta).toFixed(1); ajustarPeloPace(); }
        function salvarPerfil() {
            appData.atleta = { nome: document.getElementById('p-nome').value, idade: parseInt(document.getElementById('p-idade').value), peso: parseFloat(document.getElementById('p-peso').value), stravaId: document.getElementById('strava-id').value, stravaSecret: document.getElementById('strava-secret').value, altura: 1.75 };
            toggleModal('modal-perfil'); atualizarInterface();
        }
        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
    </script>
</body>
</html>
