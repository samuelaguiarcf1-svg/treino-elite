<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Pro Elite - Master Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50 p-4 border-b-2 border-orange-600">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-bolt text-white"></i></div>
                <h1 class="text-sm font-black uppercase tracking-tighter" id="display-nome">Atleta Elite</h1>
            </div>
            <button onclick="toggleModal('modal-perfil')" class="bg-slate-800 p-2 px-4 rounded-xl text-xs font-bold border border-slate-600">CONFIGURAR APP</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                    <h2 class="text-xl font-black text-slate-800 uppercase italic">Análise de Atividades</h2>
                    <button onclick="iniciarConexaoStrava()" class="w-full md:w-auto bg-[#FC6100] text-white px-8 py-4 rounded-2xl font-black text-xs tracking-widest hover:brightness-110 shadow-lg flex items-center justify-center gap-2">
                        <i class="fab fa-strava text-lg"></i> SINCRONIZAR COM STRAVA
                    </button>
                </div>
                <div id="lista-treinos" class="space-y-3">
                    <div class="text-center py-20 text-slate-300 italic">Configure seu Perfil para importar dados.</div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-6">
            <div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-2xl">
                <h3 class="text-orange-500 font-black uppercase text-[10px] tracking-widest mb-4 italic">Volume Acumulado</h3>
                <div class="flex items-baseline gap-2">
                    <span class="text-6xl font-black tracking-tighter" id="total-km">0</span>
                    <span class="text-xl font-bold opacity-40">KM</span>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETALHES -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-8 md:p-10 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div id="detalhes-corpo" class="space-y-6 text-center"></div>
            <button onclick="toggleModal('modal-detalhes')" class="w-full mt-8 bg-slate-100 text-slate-500 py-4 rounded-xl font-black uppercase text-[10px]">Fechar</button>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 text-center text-slate-800 uppercase italic">Configuração</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100">
                    <input type="text" id="strava-id" placeholder="Seu Client ID" class="w-full p-3 mb-2 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                    <input type="password" id="strava-secret" placeholder="Seu Client Secret" class="w-full p-3 rounded-xl border-none outline-none font-bold text-center text-sm shadow-sm">
                </div>
                <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border p-4 rounded-xl font-bold text-center outline-none">
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-[10px] shadow-lg">Salvar Perfil</button>
                <button type="button" onclick="limparTudo()" class="w-full bg-red-50 text-red-500 py-2 rounded-xl font-bold uppercase text-[8px] mt-4">Resetar App (Limpar Cache)</button>
            </form>
        </div>
    </div>

    <script>
        let appData = { atleta: { nome: "Atleta Elite", stravaId: "", stravaSecret: "" }, treinos: [] };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Master_VFinal');
            if (saved) appData = JSON.parse(saved);

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                window.history.pushState({}, document.title, window.location.pathname);
                finalizarConexao(code);
            }
            atualizarInterface();
        };

        function iniciarConexaoStrava() {
            const clientId = appData.atleta.stravaId ? appData.atleta.stravaId.toString().trim() : "";
            
            if(!clientId) {
                alert("Por favor, preencha o Client ID no seu perfil primeiro!");
                toggleModal('modal-perfil');
                return;
            }

            const redirectUri = window.location.origin + window.location.pathname;
            const scope = "activity:read_all";
            
            // CONSTRUÇÃO ROBUSTA DA URL PARA EVITAR ERROS DE "BAD REQUEST"
            const authUrl = "https://www.strava.com/oauth/authorize?" + 
                           "client_id=" + clientId + 
                           "&redirect_uri=" + encodeURIComponent(redirectUri) + 
                           "&response_type=code" + 
                           "&scope=" + scope + 
                           "&approval_prompt=auto";

            console.log("Iniciando conexão com Strava via:", authUrl);
            window.location.href = authUrl;
        }

        async function finalizarConexao(code) {
            toast("Autenticando...");
            try {
                const response = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: appData.atleta.stravaId.toString().trim(),
                        client_secret: appData.atleta.stravaSecret.toString().trim(),
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                const data = await response.json();
                if(data.access_token) buscarAtividades(data.access_token);
                else alert("Erro: Client Secret inválido. Verifique no painel do Strava.");
            } catch (e) { alert("Erro de comunicação."); }
        }

        async function buscarAtividades(token) {
            toast("Buscando treinos...");
            try {
                const resp = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=30', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const activities = await resp.json();
                let novos = 0;
                activities.forEach(a => {
                    if(a.type === 'Run' && !appData.treinos.some(t => t.stravaId === a.id)) {
                        appData.treinos.unshift({
                            id: 'rt-' + Date.now() + Math.random(),
                            stravaId: a.id, nome: a.name, data: a.start_date,
                            distancia: (a.distance / 1000).toFixed(2),
                            tempoSegundos: a.moving_time,
                            bpm: Math.round(a.average_heartrate || 0)
                        });
                        novos++;
                    }
                });
                atualizarInterface();
                toast(novos + " Treinos Importados!");
            } catch (e) { alert("Erro ao carregar atividades."); }
        }

        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const totalKm = appData.treinos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('total-km').innerText = Math.round(totalKm);
            
            if(appData.treinos.length > 0) {
                document.getElementById('lista-treinos').innerHTML = appData.treinos.map(t => `
                    <div class="bg-white border-2 p-4 rounded-2xl flex justify-between items-center hover:border-orange-500 transition-all cursor-pointer shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 flex flex-col items-center justify-center font-black text-[10px]">
                                ${t.distancia}
                            </div>
                            <div>
                                <h4 class="font-black text-[10px] uppercase">${t.nome}</h4>
                                <div class="flex gap-2 mt-1">
                                    <span class="metric-pill">BPM: ${t.bpm || '--'}</span>
                                    <span class="metric-pill">${new Date(t.data).toLocaleDateString('pt-BR')}</span>
                                </div>
                            </div>
                        </div>
                        <i class="fab fa-strava text-orange-500 opacity-30"></i>
                    </div>
                `).join('');
            }
            localStorage.setItem('RunTrackElite_Master_VFinal', JSON.stringify(appData));
        }

        function salvarPerfil() {
            appData.atleta.nome = document.getElementById('p-nome').value || "Atleta Elite";
            appData.atleta.stravaId = document.getElementById('strava-id').value.trim();
            appData.atleta.stravaSecret = document.getElementById('strava-secret').value.trim();
            toggleModal('modal-perfil');
            atualizarInterface();
            toast("Configurações Salvas!");
        }

        function limparTudo() {
            if(confirm("Deseja limpar todos os dados e cache do App?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-xl text-[10px] font-black z-[200] shadow-2xl uppercase";
            t.innerText = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
