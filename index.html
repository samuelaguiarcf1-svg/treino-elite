<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite PRO - Master Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .strava-orange { color: #FC6100; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        .dist-base { font-weight: 900; }
        .dist-decimal { font-size: 0.7em; opacity: 0.6; }
        
        /* Animação de entrada */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER PRO -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-orange-500/50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl flex items-center justify-center text-xl shadow-lg shadow-orange-500/20">
                    <i class="fas fa-bolt text-white"></i>
                </div>
                <div>
                    <h1 class="text-md font-black tracking-tighter uppercase leading-none" id="display-nome">Atleta Elite</h1>
                    <p class="text-[9px] text-orange-400 font-bold uppercase tracking-[0.2em] mt-1">Analytics Dashboard</p>
                </div>
            </div>
            
            <div class="hidden md:flex gap-4">
                <div class="bg-slate-800/50 p-2 px-5 rounded-xl border border-slate-700">
                    <span class="text-[8px] block uppercase opacity-50 font-black">VO2 Est.</span>
                    <span class="text-lg font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800/50 p-2 px-5 rounded-xl border border-slate-700">
                    <span class="text-[8px] block uppercase opacity-50 font-black">Eficiência</span>
                    <span class="text-lg font-black text-blue-400 font-mono-performance" id="display-eficiencia">--</span>
                </div>
            </div>

            <button onclick="toggleModal('modal-perfil')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition border border-slate-600">
                <i class="fas fa-user-gear"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- COLUNA ESQUERDA: LISTA E IMPORTAÇÃO -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 uppercase italic">Histórico de Atividades</h2>
                        <p class="text-xs text-slate-400 font-medium">Sincronizado via Strava API v3</p>
                    </div>
                    <button onclick="iniciarConexaoStrava()" class="w-full md:w-auto bg-[#FC6100] text-white px-8 py-4 rounded-2xl font-black text-xs tracking-widest hover:brightness-110 transition shadow-lg shadow-orange-500/20 flex items-center justify-center gap-3">
                        <i class="fab fa-strava text-lg"></i> SINCRONIZAR DADOS
                    </button>
                </div>

                <div id="lista-treinos" class="space-y-3">
                    <!-- Cards de treino entram aqui -->
                    <div class="text-center py-20 text-slate-300 italic">Nenhum treino importado ainda.</div>
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA: INSIGHTS E SIMULADOR -->
        <div class="lg:col-span-4 space-y-6">
            <!-- WIDGET DE RESUMO SEMANAL -->
            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <h3 class="text-orange-500 font-black uppercase text-[10px] tracking-widest mb-4 italic">Volume Total</h3>
                    <div class="flex items-baseline gap-2">
                        <span class="text-6xl font-black tracking-tighter" id="total-km">0</span>
                        <span class="text-xl font-bold opacity-40">KM</span>
                    </div>
                    <div class="mt-6 pt-6 border-t border-white/10 grid grid-cols-2 gap-4 text-center">
                        <div>
                            <p class="text-[9px] font-black uppercase opacity-40">Treinos</p>
                            <p class="text-xl font-black" id="count-treinos">0</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black uppercase opacity-40">Pace Médio</p>
                            <p class="text-xl font-black font-mono-performance" id="pace-geral">--</p>
                        </div>
                    </div>
                </div>
                <div class="absolute -right-10 -bottom-10 text-white opacity-[0.03] text-[12rem] rotate-12">
                    <i class="fas fa-running"></i>
                </div>
            </div>

            <!-- SIMULADOR DE PACE -->
            <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm">
                <h3 class="text-slate-800 font-black uppercase text-xs tracking-widest mb-6 italic">Simulador de Ritmo</h3>
                <div class="space-y-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <label class="text-[9px] font-black uppercase text-slate-400 block mb-2">Distância Alvo (km)</label>
                        <input type="number" id="sim-dist" value="10" oninput="ajustarSimulador()" class="bg-transparent text-3xl font-black w-full outline-none">
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1 bg-slate-50 p-4 rounded-2xl">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2">Minutos</label>
                            <input type="number" id="sim-pace-min" value="5" oninput="ajustarSimulador()" class="bg-transparent text-2xl font-black w-full outline-none">
                        </div>
                        <div class="flex-1 bg-slate-50 p-4 rounded-2xl">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2">Segundos</label>
                            <input type="number" id="sim-pace-seg" value="00" oninput="ajustarSimulador()" class="bg-transparent text-2xl font-black w-full outline-none text-blue-600">
                        </div>
                    </div>
                    <div class="bg-blue-600 text-white p-5 rounded-2xl text-center shadow-lg shadow-blue-500/20">
                        <span class="text-[9px] uppercase font-black opacity-60 block mb-1">Velocidade Requerida</span>
                        <p class="text-2xl font-black"><span id="sim-vel-res">12,0</span> <small class="text-xs opacity-60">KM/H</small></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE ANÁLISE MINUCIOSA -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] p-8 md:p-12 shadow-2xl overflow-y-auto max-h-[90vh] fade-in">
            <div id="detalhes-header" class="text-center mb-8"></div>
            <div id="detalhes-corpo" class="space-y-6"></div>
            <button onclick="toggleModal('modal-detalhes')" class="w-full mt-8 bg-slate-100 text-slate-500 py-4 rounded-2xl font-black uppercase text-xs hover:bg-slate-200 transition">Fechar Análise</button>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-8 text-center italic text-slate-800 uppercase">Configuração de Elite</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4">
                <div class="bg-orange-50 p-6 rounded-2xl border border-orange-100">
                    <label class="text-[10px] font-black uppercase text-orange-600 block mb-3 text-center">Strava API Client ID</label>
                    <input type="text" id="strava-id" placeholder="Ex: 123456" class="w-full p-4 bg-white rounded-xl border-none outline-none text-center font-bold shadow-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Nome do Atleta</label>
                    <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border-2 p-4 rounded-2xl font-bold outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Peso (kg)</label>
                        <input type="number" step="0.1" id="p-peso" placeholder="75.0" class="w-full border-2 p-4 rounded-2xl font-bold outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Idade</label>
                        <input type="number" id="p-idade" placeholder="30" class="w-full border-2 p-4 rounded-2xl font-bold outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase text-xs shadow-xl mt-4 hover:bg-black transition">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO DO APP ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, stravaId: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Pro_V1');
            if (saved) {
                appData = JSON.parse(saved);
                // Garantir campos para treinos antigos
                appData.treinos.forEach(t => { if(!t.telemetria) t.telemetria = {}; });
            }

            // Captura token do Strava após redirecionamento
            const urlHash = window.location.hash;
            if (urlHash.includes("access_token=")) {
                const token = urlHash.split("access_token=")[1].split("&")[0];
                window.history.pushState({}, document.title, window.location.pathname);
                buscarAtividades(token);
            }

            atualizarInterface();
            ajustarSimulador();
        };

        // --- CONEXÃO STRAVA ---
        function iniciarConexaoStrava() {
            const clientId = appData.atleta.stravaId;
            if(!clientId) {
                alert("Configure seu Strava Client ID no Perfil primeiro!");
                toggleModal('modal-perfil');
                return;
            }
            const redirectUri = window.location.origin + window.location.pathname;
            const scope = "activity:read_all";
            const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;
        }

        async function buscarAtividades(token) {
            toast("Iniciando Sincronização Inteligente...");
            try {
                const response = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const activities = await response.json();
                
                let novosCount = 0;
                activities.forEach(a => {
                    const existe = appData.treinos.some(t => t.stravaId === a.id);
                    if(a.type === 'Run' && !existe) {
                        appData.treinos.unshift({
                            id: 'rt-' + Date.now() + Math.random(),
                            stravaId: a.id,
                            nome: a.name,
                            data: a.start_date,
                            distancia: (a.distance / 1000).toFixed(2),
                            tempoSegundos: a.moving_time,
                            tempoFormatado: formatarTempo(a.moving_time),
                            bpm: Math.round(a.average_heartrate || 0),
                            telemetria: {
                                ganhoElev: Math.round(a.total_elevation_gain || 0),
                                cadencia: Math.round(a.average_cadence * 2) || 0,
                                bpmMax: Math.round(a.max_heartrate || 0)
                            }
                        });
                        novosCount++;
                    }
                });
                atualizarInterface();
                toast(`✅ ${novosCount} novas atividades analisadas!`);
            } catch (e) { 
                console.error(e);
                alert("Erro na sincronização. Verifique seu Client ID."); 
            }
        }

        // --- ANÁLISE MINUCIOSA (MODAL) ---
        function abrirAnalise(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;

            const paceDecimal = t.tempoSegundos / (t.distancia * 60);
            const paceMin = Math.floor(t.tempoSegundos / t.distancia / 60);
            const paceSeg = Math.round((t.tempoSegundos / t.distancia) % 60);
            const kmh = (t.distancia / (t.tempoSegundos / 3600)).toFixed(1);
            
            // Cálculos Avançados
            const eficiencia = t.bpm > 0 ? (kmh / t.bpm).toFixed(3) : "N/A";
            const vo2 = Math.round((kmh * 16.6 * 0.18) + 3.5); // Rockport simplificado para corrida

            // Predição Riegel
            const pred10k = formatarTempo(t.tempoSegundos * Math.pow((10 / t.distancia), 1.06));
            const pred21k = formatarTempo(t.tempoSegundos * Math.pow((21.1 / t.distancia), 1.06));

            document.getElementById('detalhes-header').innerHTML = `
                <div class="inline-block bg-orange-100 text-orange-600 text-[10px] font-black px-4 py-1 rounded-full uppercase mb-3">Relatório de Performance</div>
                <h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">${t.nome}</h3>
                <p class="text-slate-400 font-bold text-xs uppercase mt-1">${new Date(t.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'})}</p>
            `;

            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="grid grid-cols-3 gap-4 text-center bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100">
                    <div><p class="text-[9px] font-black text-slate-400 uppercase">Distância</p><p class="text-2xl font-black">${t.distancia}k</p></div>
                    <div><p class="text-[9px] font-black text-slate-400 uppercase">Ritmo</p><p class="text-2xl font-black font-mono-performance text-blue-600">${paceMin}:${paceSeg.toString().padStart(2,'0')}</p></div>
                    <div><p class="text-[9px] font-black text-slate-400 uppercase">Tempo</p><p class="text-2xl font-black font-mono-performance">${t.tempoFormatado}</p></div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white border p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Eficiência</p>
                        <p class="text-xl font-black text-emerald-500">${eficiencia}</p>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Cadência</p>
                        <p class="text-xl font-black text-blue-500">${t.telemetria.cadencia || '--'}</p>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-black text-slate-400 uppercase">BPM Médio</p>
                        <p class="text-xl font-black text-rose-500">${t.bpm || '--'}</p>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Ganho Elev.</p>
                        <p class="text-xl font-black text-orange-500">${t.telemetria.ganhoElev}m</p>
                    </div>
                </div>

                <div class="bg-slate-900 text-white p-8 rounded-[2.5rem]">
                    <h4 class="text-[10px] font-black uppercase text-orange-500 mb-6 tracking-widest italic">Projeções para este esforço</h4>
                    <div class="flex justify-between">
                        <div><p class="text-[9px] font-bold opacity-40 uppercase">Previsão 10k</p><p class="text-xl font-black font-mono-performance">${pred10k}</p></div>
                        <div><p class="text-[9px] font-bold opacity-40 uppercase">Previsão 21k</p><p class="text-xl font-black font-mono-performance">${pred21k}</p></div>
                        <div><p class="text-[9px] font-bold opacity-40 uppercase">VO2 Est.</p><p class="text-xl font-black font-mono-performance text-emerald-400">${vo2}</p></div>
                    </div>
                </div>

                <div class="bg-blue-50 border border-blue-100 p-6 rounded-3xl text-sm text-blue-800 leading-relaxed">
                    <i class="fas fa-robot mr-2"></i> <b>Coach Insight:</b> ${gerarFeedback(t, eficiencia, kmh)}
                </div>
            `;
            toggleModal('modal-detalhes');
        }

        function gerarFeedback(t, ef, kmh) {
            if(t.telemetria.cadencia > 0 && t.telemetria.cadencia < 168) 
                return "Sua cadência está abaixo do ideal. Tente dar passos mais curtos e frequentes para poupar suas articulações.";
            if(t.bpm > 170 && kmh < 11)
                return "Seus batimentos estão muito altos para esta velocidade. Sugiro focar em treinos de base (Z2) para melhorar sua eficiência cardiovascular.";
            if(ef > 0.08)
                return "Excelente eficiência! Você está convertendo muito bem seu esforço cardíaco em deslocamento.";
            return "Treino sólido. Continue mantendo a consistência no volume semanal para ver progresso no VO2.";
        }

        // --- INTERFACE E ATUALIZAÇÃO ---
        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            
            const treinos = appData.treinos;
            const totalKm = treinos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            const count = treinos.length;

            document.getElementById('total-km').innerText = Math.round(totalKm);
            document.getElementById('count-treinos').innerText = count;

            if(count > 0) {
                const totalSegs = treinos.reduce((a, b) => a + b.tempoSegundos, 0);
                const paceMédioGeral = formatarPace(totalSegs / totalKm);
                document.getElementById('pace-geral').innerText = paceMédioGeral;
                
                // Métricas do Header (Baseado no último treino)
                const ultimo = treinos[0];
                const kmh = (ultimo.distancia / (ultimo.tempoSegundos / 3600));
                document.getElementById('display-vo2').innerText = Math.round((kmh * 16.6 * 0.18) + 3.5);
                document.getElementById('display-eficiencia').innerText = ultimo.bpm > 0 ? (kmh / ultimo.bpm).toFixed(2) : "--";
            }

            renderizarLista();
            localStorage.setItem('RunTrackElite_Pro_V1', JSON.stringify(appData));
        }

        function renderizarLista() {
            const container = document.getElementById('lista-treinos');
            if(appData.treinos.length === 0) return;

            container.innerHTML = appData.treinos.map(t => `
                <div class="fade-in group bg-white border-2 border-slate-100 p-5 rounded-[2rem] flex items-center justify-between hover:border-orange-200 hover:shadow-xl transition-all cursor-pointer" onclick="abrirAnalise('${t.id}')">
                    <div class="flex items-center gap-6 text-left">
                        <div class="w-14 h-14 rounded-2xl bg-slate-50 flex flex-col items-center justify-center font-black text-slate-800 shadow-inner group-hover:bg-orange-50 transition-colors">
                            <span class="text-[7px] uppercase opacity-40">KM</span>
                            <div class="text-xl leading-none">${fDistHTML(t.distancia)}</div>
                        </div>
                        <div>
                            <h4 class="font-black text-slate-700 uppercase text-xs tracking-tight truncate max-w-[200px]">${t.nome}</h4>
                            <div class="flex gap-2 mt-2">
                                <span class="metric-pill"><i class="fas fa-clock text-blue-400"></i> ${t.tempoFormatado}</span>
                                <span class="metric-pill"><i class="fas fa-bolt text-orange-500"></i> ${formatarPace(t.tempoSegundos/t.distancia)}</span>
                                <span class="metric-pill"><i class="fas fa-heart text-red-400"></i> ${t.bpm || '--'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <i class="fab fa-strava text-orange-500 text-lg opacity-20 group-hover:opacity-100 transition-opacity"></i>
                        <button onclick="event.stopPropagation(); removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 p-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- HELPERS ---
        function formatarTempo(segs) {
            const h = Math.floor(segs / 3600);
            const m = Math.floor((segs % 3600) / 60);
            const s = Math.round(segs % 60);
            return h > 0 ? 
                `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : 
                `${m}:${s.toString().padStart(2,'0')}`;
        }

        function formatarPace(segundosPorKm) {
            if(!segundosPorKm || segundosPorKm === Infinity) return "0:00";
            const m = Math.floor(segundosPorKm / 60);
            const s = Math.round(segundosPorKm % 60);
            return `${m}:${s.toString().padStart(2,'0')}`;
        }

        function fDistHTML(v) {
            const partes = parseFloat(v).toFixed(1).split('.');
            return `<span>${partes[0]}</span><span class="dist-decimal">.${partes[1]}</span>`;
        }

        function ajustarSimulador() {
            const d = parseFloat(document.getElementById('sim-dist').value) || 0;
            const min = parseInt(document.getElementById('sim-pace-min').value) || 0;
            const seg = parseInt(document.getElementById('sim-pace-seg').value) || 0;
            const tempoTotalMin = (min * d) + (seg * d / 60);
            if(tempoTotalMin > 0) {
                const kmh = (d / (tempoTotalMin / 60)).toFixed(1);
                document.getElementById('sim-vel-res').innerText = kmh.replace('.', ',');
            }
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function salvarPerfil() {
            appData.atleta.nome = document.getElementById('p-nome').value || "Atleta Elite";
            appData.atleta.stravaId = document.getElementById('strava-id').value;
            appData.atleta.peso = parseFloat(document.getElementById('p-peso').value);
            appData.atleta.idade = parseInt(document.getElementById('p-idade').value);
            toggleModal('modal-perfil');
            atualizarInterface();
            toast("Perfil de Elite atualizado!");
        }

        function removerTreino(id) {
            if(confirm("Deseja remover esta análise do histórico?")) {
                appData.treinos = appData.treinos.filter(t => t.id !== id);
                atualizarInterface();
            }
        }

        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black z-[200] shadow-2xl fade-in flex items-center gap-3";
            t.innerHTML = `<i class="fas fa-info-circle text-orange-500"></i> ${m.toUpperCase()}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
