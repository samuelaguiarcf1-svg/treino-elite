<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack Elite V50 - Deep Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-mono-performance { font-family: 'JetBrains Mono', monospace; }
        .treino-planejado { border-left: 8px dashed #cbd5e1; background-color: #fcfdfe; }
        .treino-concluido { border-left: 8px solid #2563eb; background-color: #ffffff; }
        .checkbox-day:checked + label { background-color: #2563eb; color: white; }
        .dist-base { font-weight: 900; line-height: 1; }
        .dist-decimal { font-size: 0.6em; opacity: 0.5; font-weight: 700; vertical-align: baseline; }
        .coach-note { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .metric-pill { @apply bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1; }
        .strava-orange { color: #FC6100; }
        .scale-up { animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-900 font-medium">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-2xl sticky top-0 z-50 p-4 border-b border-blue-500/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div id="avatar-container" class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-xl border-2 border-blue-500 shadow-inner">
                    <i class="fas fa-user-ninja"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase" id="display-nome">Atleta Elite</h1>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest" id="display-info">Deep Analytics Lab</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black tracking-tighter">VO2 Máx</span>
                    <span class="text-xl font-black text-emerald-400 font-mono-performance" id="display-vo2">--</span>
                </div>
                <div class="bg-slate-800 p-2 px-6 rounded-2xl text-center border border-slate-700 shadow-lg">
                    <span class="text-[8px] block uppercase opacity-50 font-black tracking-tighter">IMC</span>
                    <span class="text-xl font-black text-blue-400 font-mono-performance" id="display-imc">--</span>
                </div>
                <button onclick="toggleModal('modal-perfil')" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl transition shadow-xl"><i class="fas fa-cog"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        <!-- DASHBOARD -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 text-center">
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2">Volume Ciclo</h3>
                <p class="text-4xl" id="km-semana">,0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-orange-500 md:col-span-3 text-left px-10 flex flex-col justify-center">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Desgaste Tênis</h3>
                    <span class="text-[9px] font-bold text-slate-300 uppercase italic">Limite Sugerido: 600km</span>
                </div>
                <div class="flex items-center gap-6">
                    <p class="text-3xl" id="km-tenis">,0</p>
                    <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden shadow-inner"><div id="barra-tenis" class="bg-orange-500 h-full transition-all duration-1000 w-0"></div></div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- AGENDA -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight uppercase italic">Minha Agenda</h2>
                        <div class="flex gap-2">
                            <button onclick="conectarStravaReal()" class="bg-orange-500 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                                <i class="fab fa-strava text-lg"></i> SINCRONIZAR
                            </button>
                            <button onclick="toggleModal('modal-wizard')" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest hover:bg-blue-700 transition shadow-lg uppercase">+ Planejar</button>
                        </div>
                    </div>
                    <div id="lista-treinos" class="space-y-4"></div>
                </div>
            </div>

            <!-- SIMULADOR PACE (MANTIDO 100% CONFORME SOLICITADO) -->
            <div class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-white">
                    <h2 class="text-xl font-black mb-6 text-blue-400 italic">Simulador Pace</h2>
                    <div class="space-y-5">
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 text-center">
                            <label class="text-[9px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Distância (km)</label>
                            <div class="flex items-center justify-between px-2">
                                <button onclick="alterarDistancia(-0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-left"></i></button>
                                <input type="text" id="sim-dist" value="10" oninput="validarNumeros(this); ajustarPeloTempo();" class="bg-transparent text-4xl font-black text-white text-center w-24 outline-none font-mono-performance">
                                <button onclick="alterarDistancia(0.5)" class="text-slate-500 hover:text-white p-2"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1 bg-slate-800 p-3 rounded-2xl text-center">
                                <label class="text-[8px] font-black uppercase text-slate-500 block mb-1">Min</label>
                                <input type="number" id="sim-pace-min" value="5" oninput="ajustarPeloPace()" class="bg-transparent w-full text-2xl font-black text-center text-white outline-none">
                            </div>
                            <div class="flex-1 bg-slate-800 p-3 rounded-2xl text-center">
                                <label class="text-[8px] font-black uppercase text-slate-500 block mb-1">Seg</label>
                                <input type="number" id="sim-pace-seg" value="0" oninput="ajustarPeloPace()" class="bg-transparent w-full text-2xl font-black text-center text-white outline-none">
                            </div>
                        </div>
                        <div class="bg-blue-600/10 p-5 rounded-3xl text-center border border-blue-500/20 shadow-inner">
                            <span class="text-[8px] font-black text-blue-400 block mb-1">Velocidade Média</span>
                            <p class="text-2xl font-black text-white"><span id="sim-vel-res">12,0</span> <small class="text-[10px] opacity-40 uppercase tracking-tighter">km/h</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETALHES COM DEEP ANALYTICS -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/98 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] p-8 md:p-12 shadow-2xl overflow-y-auto max-h-[90vh] scale-up">
            <div id="detalhes-header" class="text-center mb-8 border-b pb-6 border-slate-100"></div>
            
            <div id="detalhes-corpo" class="space-y-6">
                <!-- Injetado via JS com Deep Analytics -->
            </div>

            <div class="mt-10 flex gap-3">
                <button onclick="toggleModal('modal-detalhes')" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Fechar Explorer</button>
                <button id="btn-whats-detalhe" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-emerald-200">
                    <i class="fab fa-whatsapp text-lg"></i> Compartilhar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div id="modal-perfil" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center italic">Perfil & Strava</h3>
            <form onsubmit="event.preventDefault(); salvarPerfil()" class="space-y-4 text-center">
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 space-y-2">
                    <label class="text-[9px] font-black uppercase text-orange-600">Strava API Credentials</label>
                    <input type="text" id="strava-id" placeholder="Client ID" class="w-full p-3 bg-white border rounded-xl outline-none text-center">
                    <input type="password" id="strava-secret" placeholder="Client Secret" class="w-full p-3 bg-white border rounded-xl outline-none text-center">
                </div>
                <input type="text" id="p-nome" placeholder="Seu Nome" class="w-full border-2 p-4 rounded-2xl text-center font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="p-idade" placeholder="Idade" class="border-2 p-4 rounded-2xl text-center font-bold">
                    <input type="number" step="0.1" id="p-peso" placeholder="Peso kg" class="border-2 p-4 rounded-2xl text-center font-bold">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <div id="modal-wizard" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white w-full max-w-3xl rounded-[3rem] p-8 shadow-2xl overflow-y-auto max-h-[95vh]">
            <h3 class="text-2xl font-black text-slate-800 text-center mb-8 uppercase italic text-blue-600">Planejamento de Ciclo</h3>
            <form onsubmit="event.preventDefault(); logicagerarPlanilhaElite();" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="date" id="wiz-data-inicio" class="p-4 bg-slate-50 rounded-2xl font-bold border">
                    <input type="date" id="wiz-data-prova" class="p-4 bg-slate-50 rounded-2xl font-bold border text-rose-500">
                    <input type="text" id="wiz-dist" value="10" placeholder="KM" oninput="validarNumeros(this)" class="p-4 bg-slate-50 rounded-2xl font-black border text-blue-600 text-center">
                </div>
                <input type="text" id="wiz-tempo" value="00:50:00" placeholder="Tempo Meta (HH:MM:SS)" class="w-full p-6 bg-slate-50 rounded-3xl text-3xl font-black text-center border-none">
                <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl">GERAR PLANILHA AGORA</button>
            </form>
        </div>
    </div>

    <script>
        // --- ESTADO INICIAL ---
        let appData = {
            atleta: { nome: "Atleta Elite", idade: 30, peso: 75, altura: 1.75, stravaId: "", stravaSecret: "" },
            treinos: []
        };

        window.onload = () => {
            const saved = localStorage.getItem('RunTrackElite_Final_Master');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('strava-id').value = appData.atleta.stravaId || "";
                document.getElementById('strava-secret').value = appData.atleta.stravaSecret || "";
            }
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if(code) processarTrocaDeToken(code);
            document.getElementById('wiz-data-inicio').value = new Date().toISOString().split('T')[0];
            atualizarInterface();
            ajustarPeloPace();
        };

        // --- DEEP ANALYTICS ENGINE (CORAÇÃO DA V50) ---
        function abrirDetalhes(id) {
            const t = appData.treinos.find(x => x.id === id);
            if(!t) return;

            const paceSegs = tempoParaSegundos(t.tempo || t.metaPace) / t.distancia;
            const paceFormatado = formatarPace(paceSegs);
            const idade = appData.atleta.idade || 30;
            const bpmMax = 208 - (0.7 * idade);

            // Header do Explorer
            document.getElementById('detalhes-header').innerHTML = `
                <div class="flex items-center justify-center gap-2 mb-2">
                    <span class="bg-blue-100 text-blue-600 text-[10px] font-black px-4 py-1 rounded-full uppercase">${t.status === 'planejado' ? 'Planejado' : 'Análise Strava'}</span>
                    ${t.stravaId ? '<i class="fab fa-strava text-orange-500"></i>' : ''}
                </div>
                <h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">${t.nomeOriginal || t.tipo}</h3>
                <p class="text-slate-400 font-bold uppercase text-xs mt-1 font-mono-performance">${new Date(t.data).toLocaleDateString('pt-BR', {weekday: 'long', day:'2-digit', month:'long'})}</p>
            `;

            // Construção da Análise Detalhada
            let analiseIA = "";
            if(t.telemetria) {
                const tel = t.telemetria;
                const speedMS = (1000 / paceSegs); // velocidade em metros por segundo
                const heartEfficiency = (speedMS / tel.bpmMedio).toFixed(2);
                const cadenceStatus = tel.cadencia >= 175 ? "Eficiente" : "Melhorável";

                analiseIA = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 text-center">
                            <span class="text-[8px] font-black text-slate-400 uppercase">Eficiência Cardíaca</span>
                            <p class="text-xl font-black text-blue-600">${heartEfficiency}</p>
                            <small class="text-[8px] text-slate-400">m / batimento</small>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 text-center">
                            <span class="text-[8px] font-black text-slate-400 uppercase">Cadência Real</span>
                            <p class="text-xl font-black text-slate-800">${tel.cadencia} <small class="text-[10px]">ppm</small></p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 text-center">
                            <span class="text-[8px] font-black text-slate-400 uppercase">Ganho Elev.</span>
                            <p class="text-xl font-black text-rose-500">${tel.ganhoElev}m</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 text-center">
                            <span class="text-[8px] font-black text-slate-400 uppercase">Pico Esforço</span>
                            <p class="text-xl font-black text-rose-800">${tel.bpmMax} <small class="text-[10px]">bpm</small></p>
                        </div>
                    </div>

                    <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] space-y-4">
                        <p class="font-black uppercase text-[10px] flex items-center gap-2 text-blue-400"><i class="fas fa-brain"></i> Relatório de Telemetria:</p>
                        <div class="text-xs leading-relaxed space-y-3 opacity-90 italic">
                            <p>📈 <b>Eficiência de Motor:</b> Com um índice de ${heartEfficiency}, seu coração está ${heartEfficiency > 1.2 ? 'altamente treinado' : 'em fase de adaptação'}. O pace de ${paceFormatado} foi sustentado com ${tel.bpmMedio} batimentos médios.</p>
                            <p>⚙️ <b>Mecânica de Corrida:</b> Sua cadência média foi de ${tel.cadencia}. ${tel.cadencia < 168 ? 'Atenção: Passada muito longa detectada. Aumentar para +170ppm reduziria o impacto articular.' : 'Excelente técnica de economia de energia.'}</p>
                            <p>🏔️ <b>Fator Terreno:</b> O ganho de ${tel.ganhoElev}m de subida explica a oscilação cardíaca. Treino excelente para fortalecimento de potência.</p>
                        </div>
                    </div>
                `;
            } else {
                analiseIA = `<div class="coach-note p-6 rounded-3xl text-sm italic">Este é um treino planejado. Após a sincronização do Strava, trarei a telemetria detalhada aqui.</div>`;
            }

            document.getElementById('detalhes-corpo').innerHTML = `
                <div class="flex justify-around bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100">
                    <div class="text-center">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Distância</span>
                        <div class="text-2xl">${fDistHTML(t.distancia)}</div>
                    </div>
                    <div class="text-center">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Tempo</span>
                        <div class="text-2xl font-black font-mono-performance">${t.tempo || '--'}</div>
                    </div>
                    <div class="text-center">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Pace</span>
                        <div class="text-2xl font-black text-blue-600 font-mono-performance">${paceFormatado}</div>
                    </div>
                </div>
                ${analiseIA}
            `;

            document.getElementById('btn-whats-detalhe').onclick = () => enviarWhatsApp(t);
            toggleModal('modal-detalhes');
        }

        // --- FORMATAÇÃO PREMIUM Garmin-Style ---
        function fDistHTML(v) {
            let n = parseFloat(String(v).replace(',','.'))||0;
            if (n === 0) return `<span class="dist-base">0</span>`;
            let s = n.toFixed(1).replace('.', ',');
            if (s.startsWith('0,')) s = s.substring(1);
            if (s.endsWith(',0')) s = s.split(',')[0];
            if (s.includes(',')) {
                let partes = s.split(',');
                return `<span class="dist-base">${partes[0]}</span><span class="dist-decimal">,${partes[1]}</span>`;
            }
            return `<span class="dist-base">${s}</span>`;
        }

        // --- LÓGICA STRAVA ---
        function conectarStravaReal() {
            const cid = appData.atleta.stravaId;
            if(!cid) return alert("Configure Strava no Perfil.");
            const red = window.location.href.split('?')[0]; 
            window.location.href = `https://www.strava.com/oauth/authorize?client_id=${cid}&redirect_uri=${red}&response_type=code&scope=activity:read_all`;
        }

        async function processarTrocaDeToken(code) {
            try {
                const res = await fetch('https://www.strava.com/api/v3/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: appData.atleta.stravaId, client_secret: appData.atleta.stravaSecret, code: code, grant_type: 'authorization_code' })
                });
                const d = await res.json();
                if(d.access_token) {
                    buscarTreinosReais(d.access_token);
                    window.history.pushState({}, document.title, window.location.pathname);
                }
            } catch (e) { console.error(e); }
        }

        async function buscarTreinosReais(token) {
            try {
                const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=15`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const activities = await res.json();
                activities.forEach(a => {
                    const jaExiste = appData.treinos.some(t => t.stravaId === a.id);
                    if(a.type === 'Run' && !jaExiste) {
                        appData.treinos.push({
                            id: 'str-'+a.id, stravaId: a.id, nomeOriginal: a.name,
                            data: a.start_date, status: 'concluido', distancia: (a.distance / 1000).toFixed(2),
                            tempo: formatarTempoLongo(a.moving_time), bpm: Math.round(a.average_heartrate || 0),
                            telemetria: { 
                                ganhoElev: Math.round(a.total_elevation_gain), 
                                cadencia: Math.round(a.average_cadence * 2) || 0,
                                bpmMax: Math.round(a.max_heartrate || 0)
                            }
                        });
                    }
                });
                atualizarInterface();
            } catch (e) { console.error(e); }
        }

        // --- INTERFACE ---
        function atualizarInterface() {
            document.getElementById('display-nome').innerText = appData.atleta.nome;
            const imc = (appData.atleta.peso / (1.75 ** 2)).toFixed(1);
            document.getElementById('display-imc').innerText = imc;
            
            const concluidos = appData.treinos.filter(t => t.status === 'concluido');
            const totalKm = concluidos.reduce((a, b) => a + parseFloat(b.distancia), 0);
            document.getElementById('km-semana').innerHTML = fDistHTML(totalKm);
            document.getElementById('km-tenis').innerHTML = fDistHTML(totalKm);
            document.getElementById('barra-tenis').style.width = `${Math.min((totalKm/600)*100, 100)}%`;

            if(concluidos.length > 0) {
                const ref = concluidos[concluidos.length-1];
                document.getElementById('display-vo2').innerText = Math.round(((ref.distancia * 1000) / (tempoParaSegundos(ref.tempo)/60)) * 0.18 + 3.5);
            }
            renderizarAgenda();
            localStorage.setItem('RunTrackElite_Final_Master', JSON.stringify(appData));
        }

        function renderizarAgenda() {
            const lista = document.getElementById('lista-treinos');
            const treinos = appData.treinos.sort((a,b) => new Date(a.data) - new Date(b.data));
            lista.innerHTML = treinos.map(t => `
                <div class="group p-5 rounded-[2.5rem] bg-white border-2 flex items-center justify-between transition hover:border-blue-200 cursor-pointer ${t.status === 'planejado' ? 'treino-planejado border-slate-100' : 'treino-concluido border-transparent shadow-sm'}" onclick="abrirDetalhes('${t.id}')">
                    <div class="flex items-center gap-5">
                        <div class="w-16 h-16 rounded-3xl flex flex-col items-center justify-center font-black ${t.status === 'planejado' ? 'bg-slate-50 text-slate-300' : 'bg-blue-50 text-blue-600 shadow-inner'}">
                            <span class="text-[7px] uppercase tracking-tighter">KM</span>
                            <div class="text-xl">${fDistHTML(t.distancia)}</div>
                        </div>
                        <div class="text-left">
                            <h4 class="font-black text-sm uppercase text-slate-700 tracking-tighter truncate max-w-[200px]">${t.nomeOriginal || new Date(t.data).toLocaleDateString('pt-BR')}</h4>
                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="metric-pill"><i class="fas fa-stopwatch text-blue-500"></i> ${t.tempo || t.metaPace}</span>
                                ${t.stravaId ? `<i class="fab fa-strava strava-orange text-xs"></i>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fas fa-chevron-right text-slate-200 group-hover:text-blue-400 transition-colors"></i>
                        <button onclick="event.stopPropagation(); removerTreino('${t.id}')" class="text-slate-200 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt text-sm"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- HELPERS GERAIS ---
        function tempoParaSegundos(t) { const p = String(t).split(':').map(Number); return p.length === 3 ? (p[0]*3600)+(p[1]*60)+p[2] : (p[0]*60)+p[1]; }
        function formatarTempoLongo(segs) { const h = Math.floor(segs/3600).toString().padStart(2,'0'), m = Math.floor((segs%3600)/60).toString().padStart(2,'0'), s = Math.round(segs%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; }
        function formatarPace(ps) { if(!ps || ps===Infinity) return "0:00"; const m = Math.floor(ps/60), s = Math.round(ps%60).toString().padStart(2,'0'); return `${m}:${s}`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function validarNumeros(el) { el.value = el.value.replace(/[^\d,]/g, ""); }
        function alterarDistancia(delta) { const el = document.getElementById('sim-dist'); let v = parseFloat(el.value.replace(',','.'))||0; el.value = (v+delta).toFixed(1); ajustarPeloPace(); }
        function ajustarPeloPace() {
            const d = parseFloat(document.getElementById('sim-dist').value.replace(',','.'))||0;
            const p = (parseInt(document.getElementById('sim-pace-min').value)||0)*60 + (parseInt(document.getElementById('sim-pace-seg').value)||0);
            if(d>0 && p>0) document.getElementById('sim-vel-res').innerText = (d/(p*d/3600)).toFixed(1).replace('.',',');
        }
        function ajustarPeloTempo() { ajustarPeloPace(); }
        function salvarPerfil() {
            appData.atleta = { nome: document.getElementById('p-nome').value, idade: parseInt(document.getElementById('p-idade').value), peso: parseFloat(document.getElementById('p-peso').value), stravaId: document.getElementById('strava-id').value, stravaSecret: document.getElementById('strava-secret').value, altura: 1.75 };
            toggleModal('modal-perfil'); atualizarInterface();
        }
        function logicagerarPlanilhaElite() { alert("Simulando geração..."); toggleModal('modal-wizard'); }
        function removerTreino(id) { if(confirm("Apagar?")) { appData.treinos = appData.treinos.filter(t=>t.id!==id); atualizarInterface(); } }
        function enviarWhatsApp(t) { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Analise do Treino: ' + (t.nomeOriginal || t.tipo))}`, '_blank'); }
    </script>
</body>
</html>
